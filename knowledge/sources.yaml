# Migration Atlas — documentation source registry.
#
# Only the sources listed here may ever be ingested. There is no broad crawling:
# the ingester fetches the explicit seed_urls (plus, at most, same-prefix links up to
# max_pages), refuses any URL outside allowed_prefixes, honours robots.txt when
# respect_robots is true, and sleeps rate_limit_seconds between requests.
# Every source ships disabled; a user must opt in by setting enabled: true.
#
# doc_type: official-docs | github-docs | migration-guide
# technologies: ids from docs/ontology-ids.md only.

# ---------------------------------------------------------------- Google Cloud
- id: google-cloud-data-docs
  vendor: Google Cloud
  product: Google Cloud data and analytics services
  doc_type: official-docs
  enabled: false
  base_url: https://cloud.google.com/
  allowed_prefixes:
