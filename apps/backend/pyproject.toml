[project]
name = "migration-atlas-backend"
version = "0.1.0"
description = "Migration Atlas backend: ontology, connection intelligence, validation, local AI (Ollama), RAG and knowledge graph."
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "networkx>=3.2",
  "reportlab>=4.2",
  "pypdf>=4.2",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["atlas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
