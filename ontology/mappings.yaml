# ---------------------------------------------------------------- Mainframe
- id: cobol-refactor
  title: COBOL programs to Java or Spark (refactor)
  source: cobol
  source_artifact: null
  targets: [java, apache-spark]
  approaches:
    - Refactor online and transactional COBOL to Java (Spring) using automated code transformation tools, then remediate
    - Refactor batch COBOL that processes large files into PySpark or Spark jobs
    - Rewrite selected programs from business rules extracted by code analysis where automated output is unmaintainable
    - Retain stable, low-change programs on the mainframe during phased migration
  conversion_considerations:
    - Fixed-point decimal arithmetic must be preserved exactly (BigDecimal / DecimalType)
    - Copybooks, REDEFINES and OCCURS DEPENDING ON drive data structures and parsing
    - Automated translation can produce "JOBOL" that is hard to maintain without refactoring passes
    - Program calls, file I/O and DB2/IMS access patterns need target-native equivalents
  risks: [hidden-business-logic, mainframe-encoding, skills-gap, data-quality-regression, parallel-run-cost]
  automation_potential: medium
  manual_effort_areas:
    - Business rule validation with SMEs
    - Maintainability refactoring of generated code
    - Test data creation and equivalence testing
    - Performance tuning of batch throughput

