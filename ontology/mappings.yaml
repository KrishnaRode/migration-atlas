- id: cloudera-hadoop-migration
  title: Cloudera Hadoop to Databricks, Dataproc or EMR
  source: cloudera-hadoop
  source_artifact: null
  targets: [databricks, google-dataproc, amazon-emr]
  approaches:
    - Replatform Spark jobs to Dataproc or EMR with minimal code change, decoupling storage to object storage
    - Rearchitect to Databricks with Delta Lake, converting Hive tables to Delta and Hive SQL to Spark SQL
    - Migrate Hive metastore to Unity Catalog, Dataproc Metastore or AWS Glue Data Catalog
    - Replace Oozie workflows with Databricks Workflows, Cloud Composer or MWAA
  conversion_considerations:
    - HDFS paths hard-coded in jobs must be parameterised to object-storage URIs
    - MapReduce, Pig and older Hive UDFs typically need rewrite in Spark
    - Ranger/Sentry policies must be mapped to target governance controls
    - Impala and HBase workloads need separate target decisions
  risks: [data-volume-transfer, skills-gap, governance-gap, lineage-loss, performance-regression, security-gap]
  automation_potential: medium
  manual_effort_areas:
    - MapReduce, Pig and UDF rewrite
    - Ranger/Sentry policy translation
    - Oozie workflow conversion
    - Small-file compaction and table-format conversion

- id: hdfs-to-object-storage
  title: HDFS to cloud object storage
  source: hdfs
  source_artifact: null
  targets: [google-cloud-storage, amazon-s3, adls-gen2]
  approaches:
    - Bulk copy with DistCp over dedicated interconnect, partitioned by directory and validated by checksum
    - Use offline transfer appliances for multi-petabyte datasets
    - Convert Hive/Parquet tables to Delta Lake or Apache Iceberg during or after copy
  conversion_considerations:
    - HDFS block checksums differ from object-store checksums; use composite CRC or file-level validation
    - Object storage has no atomic directory rename; jobs relying on rename-based commits need committers or table formats
    - Small-file proliferation raises request costs and should be compacted
    - HDFS ACLs and Ranger policies map to IAM and catalog permissions
  risks: [data-volume-transfer, network-bandwidth, security-gap, cost-overrun]
  automation_potential: high
  manual_effort_areas:
    - Transfer wave planning and bandwidth scheduling
    - Permission model translation
    - Small-file compaction strategy

# ---------------------------------------------------------------- ETL
- id: informatica-powercenter-modernization
  title: Informatica PowerCenter to cloud-native pipelines
  source: informatica-powercenter
  source_artifact: null
  targets: [lakeflow-declarative-pipelines, dbt, apache-airflow, google-dataflow, azure-data-factory]
  approaches:
    - Export repository metadata (XML) and inventory mappings, mapplets, sessions and workflows by complexity
    - Convert mappings to PySpark/Lakeflow Declarative Pipelines or dbt models using automated converters, then remediate
    - Convert workflow and worklet orchestration to Airflow DAGs, Databricks Workflows or ADF pipelines
    - Repurchase path to Informatica IDMC for teams wishing to keep the Informatica paradigm
  conversion_considerations:
    - Reusable transformations, mapplets and parameter files hide logic and must be resolved during conversion
    - Lookup caching, update strategy and router transformations need target-idiomatic patterns (MERGE, joins, filters)
    - Pre/post-session SQL, stored procedure transformations and Java transformations need manual rewrite
    - Session-level error handling and recovery semantics differ from target frameworks
  risks: [hidden-business-logic, lineage-loss, skills-gap, licensing-overlap, data-quality-regression]
  automation_potential: medium
  manual_effort_areas:
    - Java and custom transformation rewrite
    - Pre/post-session SQL and stored-procedure calls
    - Parameter file and connection management redesign
    - Reconciliation of complex mappings

- id: datastage-modernization
  title: IBM DataStage to cloud-native pipelines
  source: ibm-datastage
  source_artifact: null
  targets: [lakeflow-declarative-pipelines, dbt, apache-spark, azure-data-factory, google-dataflow]
  approaches:
    - Export DSX/ISX job definitions and inventory parallel and server jobs by stage usage
    - Convert parallel jobs to PySpark or Lakeflow Declarative Pipelines with automated converters
    - Convert sequence jobs to orchestrator DAGs (Databricks Workflows, Airflow, ADF)
    - Rewrite BASIC transformer routines and server jobs manually
  conversion_considerations:
    - Partitioning and sort stages in parallel jobs are often unnecessary on Spark and should be removed
    - Transformer stage expressions and stage variables carry state across rows that needs window functions
    - Shared containers and job parameters must be resolved before conversion
    - BASIC routines and before/after subroutines have no automated equivalent
  risks: [hidden-business-logic, skills-gap, lineage-loss, licensing-overlap]
  automation_potential: medium
  manual_effort_areas:
    - BASIC routine and server job rewrite
    - Stage-variable state logic redesign
    - Sequence job orchestration conversion
    - Reconciliation

