  targets: [alloydb, cloud-sql, amazon-aurora, delta-lake, google-cloud-storage]
  approaches:
    - Extract VSAM files in binary mode and convert using copybook-driven parsers to relational tables
    - Land converted data as Delta or Parquet for analytics use cases
    - Use CDC tooling for VSAM where continuous synchronisation is required during coexistence
  conversion_considerations:
    - EBCDIC, COMP-3 and binary fields must be decoded exactly using verified copybooks
    - KSDS keys and alternate indexes map to primary keys and indexes
    - Multiple record types in one file need splitting into separate tables
  risks: [mainframe-encoding, data-type-mismatch, data-quality-regression]
  automation_potential: medium
  manual_effort_areas:
    - Copybook verification and REDEFINES handling
    - Record-type splitting design
    - Control-total reconciliation

