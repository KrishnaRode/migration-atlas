# ---------------------------------------------------------------- Messaging and applications
- id: ibm-mq-to-event-streaming
  title: IBM MQ to event streaming platforms
  source: ibm-mq
  source_artifact: null
  targets: [apache-kafka, google-pubsub, azure-event-hubs, amazon-msk]
  approaches:
    - Bridge MQ queues to Kafka using Kafka Connect MQ source/sink connectors during coexistence
    - Re-architect point-to-point queues into topics with consumer groups and schema registry
    - Migrate producers and consumers application by application behind an abstraction layer
  conversion_considerations:
    - MQ provides per-message transactional semantics; Kafka offers ordering per partition and idempotent/transactional producers
    - Request/reply patterns and message selectors need redesign
    - Message formats (copybook-based, XML) should be moved to governed schemas (Avro, Protobuf)
    - Retention and replay change consumer design and storage sizing
  risks: [integration-breakage, skills-gap, schema-drift, operational-readiness]
  automation_potential: low
  manual_effort_areas:
    - Messaging pattern redesign
    - Producer and consumer code changes
    - Schema definition and governance
    - Failure and exactly-once testing

