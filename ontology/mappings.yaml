# Source -> target migration mappings for systems and artefacts.
# ---------------------------------------------------------------- Databases
- id: oracle-to-databricks
  title: Oracle Database to Databricks Lakehouse
  source: oracle-database
  source_artifact: null
  targets: [databricks, delta-lake, databricks-sql, lakeflow-connect]
  approaches:
    - Initial snapshot and ongoing CDC with Lakeflow Connect (or GoldenGate/Datastream to cloud storage) into Delta bronze tables
    - Bulk historical extract via parallel JDBC reads partitioned on numeric or date keys, landed as Parquet then converted to Delta
    - Rebuild reporting schemas as silver/gold Delta tables served through Databricks SQL warehouses
    - Rearchitect Oracle-hosted marts into a medallion design rather than replicating the source schema one-to-one
  conversion_considerations:
    - Map Oracle NUMBER without precision explicitly to DECIMAL(p,s) or BIGINT after profiling; Oracle DATE carries a time component and maps to TIMESTAMP
    - Oracle treats empty strings as NULL; downstream logic relying on this behaviour must be made explicit
    - Sequences, triggers and constraints are not enforced the same way in Delta; replace with identity columns, pipeline logic and expectations
    - Supplemental logging and archive log retention must be enabled for CDC; LOB columns need special handling in most CDC tools
    - Partitioning and indexes do not carry over; design liquid clustering or partitioning around query predicates
  risks: [data-type-mismatch, sql-dialect-conversion, cdc-lag, data-volume-transfer, performance-regression, cutover-downtime]
  automation_potential: high
  manual_effort_areas:
    - Type mapping decisions for unconstrained NUMBER, LOB and spatial columns
    - Redesign of index-dependent query patterns for the lakehouse
    - CDC configuration, supplemental logging and source DBA coordination
    - Reconciliation design and sign-off for high-value tables

- id: oracle-plsql-to-databricks
  title: PL/SQL stored procedures to Databricks SQL and Spark
  source: oracle-database
  source_artifact: "PL/SQL stored procedures"
  targets: [databricks-sql, apache-spark]
  approaches:
    - Classify procedures by pattern (set-based DML, cursor loops, orchestration, utility) and select a target idiom per class
    - Convert set-based procedures to Databricks SQL (SQL scripting, MERGE INTO, temporary views) with assisted conversion tooling
    - Refactor cursor-driven and complex procedural logic into PySpark jobs with DataFrame operations
    - Move procedure orchestration (calls between procedures, control tables) into Databricks Workflows tasks
    - Retire procedures with no callers identified from AWR, audit or dependency analysis
  conversion_considerations:
    - Row-by-row cursor loops must be rewritten as set-based operations to perform on a distributed engine
    - Packages, package state, autonomous transactions and global temporary tables have no direct equivalent
    - DBMS_* and UTL_* package calls (UTL_FILE, DBMS_SCHEDULER, DBMS_LOB) need functional replacements
    - Exception handling and transactional semantics differ; Delta provides table-level ACID, not multi-statement transactions across tables
    - Dynamic SQL must be reviewed for injection risk and rewritten with parameterised constructs
  risks: [stored-procedure-rewrite, hidden-business-logic, sql-dialect-conversion, data-quality-regression, skills-gap]
  automation_potential: medium
  manual_effort_areas:
    - Rewriting cursor-based and dynamic-SQL procedures
    - Replacing package state, global temporary tables and autonomous transactions
    - Unit test creation with golden datasets per procedure
    - Performance tuning of converted set-based logic

- id: oracle-oltp-replatform
  title: Oracle OLTP to AlloyDB or Amazon Aurora PostgreSQL
  source: oracle-database
  source_artifact: null
  targets: [alloydb, amazon-aurora]
  approaches:
    - Assess compatibility with Database Migration Service / AWS SCT and size the PL/pgSQL conversion backlog
    - Convert schema and code with automated tooling (DMS conversion workspace, AWS SCT, ora2pg) followed by manual remediation
    - Initial load and CDC replication via Database Migration Service or AWS DMS to minimise cutover downtime
    - Remediate application SQL, drivers and connection pooling; run functional and performance regression tests
  conversion_considerations:
    - PL/SQL packages become PostgreSQL schemas plus functions/procedures; package variables need redesign
    - Oracle-specific features (CONNECT BY, ROWNUM, outer join (+) syntax, DECODE) must be rewritten in ANSI/PostgreSQL SQL
    - Empty string versus NULL semantics and case-folding of identifiers differ in PostgreSQL
    - Sequence, synonym, database link and materialised view behaviour needs functional review
    - Application-level transaction isolation and locking behaviour should be retested under load
  risks: [stored-procedure-rewrite, sql-dialect-conversion, data-type-mismatch, cutover-downtime, integration-breakage, performance-regression]
  automation_potential: medium
  manual_effort_areas:
    - PL/SQL package and trigger remediation
    - Application SQL and ORM changes
    - Performance tuning of indexes and query plans on PostgreSQL
    - Cutover rehearsal and rollback planning

- id: sql-server-to-cloud
  title: SQL Server to Azure SQL, Databricks or Synapse
  source: sql-server
  source_artifact: null
  targets: [azure-sql-database, databricks, azure-synapse]
  approaches:
    - Replatform OLTP databases to Azure SQL Database or Managed Instance using Azure DMS with online migration
    - Move analytical workloads to Databricks via Lakeflow Connect or CDC into Delta tables
    - Migrate dimensional data warehouses to Azure Synapse dedicated SQL pools with distribution redesign
    - Use Data Migration Assistant to identify compatibility blockers before choosing the target
  conversion_considerations:
    - T-SQL is largely compatible with Azure SQL but not with Spark SQL; procedures targeting Databricks need rewrite
    - SQL Agent jobs, linked servers, CLR assemblies and cross-database queries need alternatives on PaaS targets
    - Synapse dedicated pools require hash/round-robin distribution and lack some T-SQL features
    - Collation and case sensitivity defaults differ across targets
  risks: [sql-dialect-conversion, stored-procedure-rewrite, cutover-downtime, integration-breakage, performance-regression]
  automation_potential: high
  manual_effort_areas:
    - Rewriting T-SQL procedures for Databricks targets
    - Replacing SQL Agent jobs, linked servers and CLR code
    - Distribution and indexing design for Synapse
    - Application connection string and authentication changes

- id: sql-server-tsql-to-databricks
  title: T-SQL stored procedures to Databricks SQL and dbt
  source: sql-server
  source_artifact: "T-SQL stored procedures"
  targets: [databricks-sql, dbt, apache-spark]
  approaches:
    - Translate set-based procedures to Databricks SQL or dbt models using assisted SQL converters
    - Refactor ELT-style procedure chains into dbt models with tests and documentation
    - Rewrite procedural logic (WHILE loops, cursors, temp tables) as PySpark jobs where set-based rewrite is impractical
  conversion_considerations:
    - Temp tables and table variables map to temporary views or staging Delta tables
    - TRY/CATCH, @@ROWCOUNT and transaction control need alternate patterns
    - IDENTITY, MERGE output clauses and OUTPUT INTO semantics differ
  risks: [stored-procedure-rewrite, sql-dialect-conversion, hidden-business-logic]
  automation_potential: medium
  manual_effort_areas:
    - Procedural loop and cursor refactoring
    - Error handling and transactional redesign
    - Unit and regression test creation

- id: ibm-db2-to-cloud
  title: IBM Db2 (LUW) to cloud platforms
  source: ibm-db2
  source_artifact: null
  targets: [databricks, bigquery, alloydb, amazon-aurora]
  approaches:
    - Move analytical schemas to Databricks or BigQuery via CDC (Qlik Replicate, Debezium, Striim) plus bulk export
    - Replatform OLTP Db2 databases to PostgreSQL-compatible AlloyDB or Aurora with schema and SQL PL conversion
    - Use Db2 EXPORT/HPU utilities for high-volume history extracts landed in cloud storage
  conversion_considerations:
    - SQL PL procedures and triggers need conversion to PL/pgSQL or Spark SQL
    - DECFLOAT, GRAPHIC/VARGRAPHIC and timestamp precision need explicit mapping
    - Db2 isolation levels and locking semantics differ from PostgreSQL MVCC
  risks: [sql-dialect-conversion, stored-procedure-rewrite, data-type-mismatch, cutover-downtime]
  automation_potential: medium
  manual_effort_areas:
    - SQL PL procedure conversion
    - CDC tool licensing and configuration
    - Application data-access layer changes

- id: sybase-ase-migration
  title: Sybase ASE to cloud databases
  source: sybase-ase
  source_artifact: null
  targets: [azure-sql-database, amazon-aurora, alloydb, databricks]
  approaches:
    - Use SQL Server Migration Assistant for Sybase to convert schema and T-SQL to Azure SQL Database
    - Convert to PostgreSQL-compatible targets with ora2pg-style tooling and manual T-SQL remediation
    - Offload reporting and history to Databricks via bulk export and CDC (Qlik Replicate, SAP Replication Server)
  conversion_considerations:
    - Sybase T-SQL dialect differs from Microsoft T-SQL in chained transaction mode, identity gaps and some functions
    - Character set and sort order settings affect comparisons and must be matched
    - Replication Server topologies and warm standbys need replacement
  risks: [sql-dialect-conversion, stored-procedure-rewrite, skills-gap, cutover-downtime]
  automation_potential: medium
  manual_effort_areas:
    - Stored procedure and trigger remediation
    - Replacement of Replication Server topology
    - Application testing for chained-mode and locking behaviour

# ---------------------------------------------------------------- Warehouses
- id: teradata-to-cloud-warehouse
  title: Teradata to BigQuery, Databricks or Snowflake
  source: teradata
  source_artifact: null
  targets: [bigquery, databricks, snowflake]
  approaches:
    - Schema and DDL conversion with automated translators (BigQuery Migration Service, Databricks/BladeBridge converters, SnowConvert)
    - Historical data extract with Teradata Parallel Transporter (TPT) to cloud storage, then bulk load
    - Incremental sync during parallel run using timestamp-based extracts or CDC
    - Wave-based migration by subject area with automated reconciliation against Teradata
  conversion_considerations:
    - Primary index and partitioned primary index designs map to clustering/partitioning, not one-to-one
    - SET tables silently deduplicate rows; target tables are MULTISET by default and need explicit dedupe logic
    - Teradata-specific constructs (QUALIFY, PERIOD types, macros, volatile tables, case-insensitive comparisons) need translation
    - Workload management (TASM) rules must be re-expressed as warehouse sizing, reservations or slot policies
    - BTEQ, FastLoad, MultiLoad and TPump jobs require separate conversion
  risks: [sql-dialect-conversion, data-volume-transfer, performance-regression, data-type-mismatch, licensing-overlap, parallel-run-cost]
  automation_potential: high
  manual_effort_areas:
    - SET table and case-sensitivity semantic review
    - Workload management and concurrency redesign
    - Performance tuning of large joins and aggregations
    - Reconciliation and parallel-run sign-off

- id: teradata-bteq-conversion
  title: Teradata BTEQ scripts to cloud SQL and orchestration
  source: teradata
  source_artifact: "BTEQ scripts"
  targets: [bigquery, databricks-sql, snowflake, dbt, databricks-workflows, apache-airflow]
  approaches:
    - Translate embedded SQL with BigQuery SQL translator, SnowConvert or Databricks converters
    - Replace BTEQ control flow (.IF ERRORCODE, .GOTO, .LABEL) with orchestrator task logic or SQL scripting blocks
    - Refactor multi-step BTEQ ETL into dbt models or Databricks SQL tasks with dependencies in the orchestrator
    - Replace FastLoad/MultiLoad steps with native bulk load or Auto Loader ingestion
  conversion_considerations:
    - BTEQ dot-commands and exit codes drive scheduler behaviour; the error semantics must be reproduced
    - Shell wrappers often perform parameter substitution and file handling around BTEQ
    - Volatile tables map to temporary tables or views with different scoping rules
    - Export formatting (.EXPORT REPORT/DATA) needs a replacement for downstream file consumers
  risks: [sql-dialect-conversion, hidden-business-logic, scheduling-dependency-loss, integration-breakage]
  automation_potential: medium
  manual_effort_areas:
    - Control-flow and error-handling redesign
    - Shell wrapper and parameter logic review
    - File export replacements for downstream consumers

- id: netezza-to-cloud
  title: Netezza to BigQuery, Snowflake or Databricks
  source: netezza
  source_artifact: null
  targets: [bigquery, snowflake, databricks]
  approaches:
    - Convert DDL, views and NZPLSQL with automated translators (BigQuery Migration Service, SnowConvert, Databricks converters)
    - Extract history with external tables / nzsql unload to compressed files in cloud storage, then bulk load
    - Rebuild NZPLSQL procedures as SQL scripting, dbt models or Spark jobs
    - Migrate by subject area with automated reconciliation against Netezza
  conversion_considerations:
    - Distribution keys and zone maps translate to clustering/partitioning strategies on the target
    - NZPLSQL procedures and UDX functions need rewrite
    - Netezza-specific SQL extensions and implicit casts need translation
    - Appliance end-of-support often fixes the timeline
  risks: [sql-dialect-conversion, stored-procedure-rewrite, data-volume-transfer, performance-regression, licensing-overlap]
  automation_potential: high
  manual_effort_areas:
    - NZPLSQL and UDX rewrite
    - Physical design and performance tuning
    - Reconciliation and parallel run

- id: oracle-exadata-migration
  title: Oracle Exadata to cloud data platforms
  source: oracle-exadata
  source_artifact: null
  targets: [databricks, bigquery, snowflake, alloydb]
  approaches:
    - Relocate to Oracle Database@Google Cloud or Exadata Database Service where time-to-exit dominates
    - Replatform analytical workloads to Databricks, BigQuery or Snowflake with SQL and PL/SQL conversion
    - Use CDC (GoldenGate, Lakeflow Connect, Datastream) plus bulk export for large-volume history
    - Replatform OLTP schemas to AlloyDB where Oracle compatibility features suffice
  conversion_considerations:
    - Exadata smart scan, storage indexes and HCC compression mask inefficient SQL that will be slow elsewhere
    - Partitioning, parallel hints and result caches need target-native redesign
    - PL/SQL-heavy ETL inside the database is usually the largest conversion item
  risks: [performance-regression, stored-procedure-rewrite, data-volume-transfer, licensing-overlap, sql-dialect-conversion]
  automation_potential: medium
  manual_effort_areas:
    - Performance re-engineering for workloads relying on Exadata offload
    - PL/SQL ETL rewrite
    - Licence and hardware decommission planning

- id: greenplum-migration
  title: Greenplum to cloud warehouse or lakehouse
  source: greenplum
  source_artifact: null
  targets: [databricks, bigquery, snowflake, amazon-redshift]
  approaches:
    - Convert PostgreSQL-derived DDL and PL/pgSQL functions with SQL translators
    - Unload history with gpfdist/external tables to object storage and bulk load
    - Replace external table ingestion with Auto Loader, Snowpipe or BigQuery load jobs
  conversion_considerations:
    - Distribution keys and append-optimised tables translate to target clustering choices
    - PL/pgSQL, PL/Python and MADlib functions need redesign
    - Resource queues and groups map to warehouse sizing or workload management
  risks: [sql-dialect-conversion, stored-procedure-rewrite, data-volume-transfer, performance-regression]
