# ---------------------------------------------------------------- Orchestration
- id: control-m-to-cloud-orchestration
  title: Control-M to cloud orchestration
  source: control-m
  source_artifact: null
  targets: [databricks-workflows, apache-airflow, cloud-composer, google-cloud-scheduler]
  approaches:
    - Export job definitions (XML/JSON) and build a dependency graph across folders and applications
    - Generate Airflow/Cloud Composer DAGs or Databricks Workflows jobs from definitions using converters
    - Use Google Cloud Scheduler only for simple time-based triggers without dependencies
    - Run Control-M and target orchestrator in hybrid mode with cross-system triggers during coexistence
  conversion_considerations:
    - In/out conditions, quantitative resources and cyclic jobs need explicit DAG patterns
    - Business calendars and holiday rules require custom timetables
    - File watchers map to sensors, Auto Loader file-arrival triggers or event-driven triggers
    - Agents executing scripts on on-prem hosts need a replacement execution model
  risks: [scheduling-dependency-loss, operational-readiness, licensing-overlap]
  automation_potential: high
  manual_effort_areas:
    - Calendar and cyclic job translation
    - Cross-application dependency redesign
    - Script execution and agent replacement
    - Shadow-run validation of execution order

