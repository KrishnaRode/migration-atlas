  description: TIBCO's enterprise integration (ESB) platform for building process-based integrations, web services and adapters, available as BW5, BW6 and BusinessWorks Container Edition.
  typical_legacy_use: Central ESB orchestrating SOAP/JMS integrations between ERP, CRM, mainframe and partner systems, usually paired with TIBCO EMS and adapters.
  capabilities: [esb, process-orchestration, adapters, soap-rest-services, message-transformation]
  possible_targets: [mulesoft, boomi, azure-api-management, apigee, aws-step-functions, apache-kafka]
  alternatives: [mulesoft, boomi, websphere]
  replaces: []
  suggested_next: [mulesoft, boomi, apache-kafka, azure-service-bus]
  migration_considerations:
    - Inventory process definitions, shared resources, adapters, XSLT/mappers and deployed services with their call volumes.
    - Decide per integration between iPaaS re-implementation, API-led redesign and event-driven re-architecture; avoid porting point-to-point anti-patterns.
    - BW5 to BW6/BWCE upgrades are themselves projects; weigh them against moving off TIBCO.
  known_challenges:
    - Java code activities and custom adapters hold logic outside visual processes.
    - Long-running, stateful processes and checkpoints need careful redesign.
