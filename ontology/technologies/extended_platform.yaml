# Extended platform estate: messaging and integration (iPaaS/ESB), BI and semantic layers,
# serverless and container compute, governance/quality/observability tools, and cloud GenAI services.
# ---------------------------------------------------------------- Messaging / integration
- id: apache-pulsar
  name: Apache Pulsar
  aliases: [pulsar, apache pulsar, streamnative]
  vendor: Apache Software Foundation
  category: streaming
  role: streaming
  layer: ingestion
  environment: any
  legacy: false
  clouds: [on-prem, aws, azure, gcp]
  stage: null
  platforms: []
  operational_model: self-managed
  icon: activity
  color: "#188FFF"
  description: Distributed messaging and event-streaming platform with separated serving (brokers) and storage (Apache BookKeeper), multi-tenancy, geo-replication and both queue and stream semantics.
  typical_legacy_use: Multi-tenant event backbone combining pub/sub streaming and work-queue messaging, sometimes replacing separate Kafka and JMS/RabbitMQ estates.
  capabilities: [event-streaming, message-queuing, multi-tenancy, geo-replication, tiered-storage]
  possible_targets: [apache-kafka, confluent-cloud]
  alternatives: [apache-kafka, confluent-cloud, google-pubsub, azure-event-hubs, amazon-kinesis]
  replaces: [rabbitmq, activemq, tibco-ems]
  suggested_next: [apache-flink, spark-structured-streaming, delta-bronze]
  migration_considerations:
    - Map tenants, namespaces and topics, subscription types (exclusive, shared, failover, key_shared) and retention policies to the target model.
    - Assess client compatibility; Kafka-protocol layers exist but do not cover every Pulsar feature.
    - Plan BookKeeper and ZooKeeper/metadata-store operations, or use a managed service.
  known_challenges:
    - Operational complexity of brokers, bookies and metadata stores is higher than single-tier brokers.
    - Smaller connector and talent ecosystem than Kafka.
  risks: [operational-readiness, skills-gap, integration-breakage]
  strategies: [retain, replatform, rearchitect]
  skills: [Apache Pulsar, event-driven architecture]
  tags: [streaming, messaging, open-source]
  docs:
    - title: Apache Pulsar documentation
      url: https://pulsar.apache.org/docs/

- id: tibco-ems
  name: TIBCO Enterprise Message Service (EMS)
  aliases: [tibco ems, tibco enterprise message service, enterprise message service, ems server]
  vendor: TIBCO (Cloud Software Group)
  category: messaging
  role: streaming
  layer: ingestion
  environment: on-prem
  legacy: true
  clouds: [on-prem]
  stage: null
  platforms: []
  operational_model: self-managed
  icon: mail
  color: "#1A6EB5"
  description: JMS-compliant enterprise messaging server providing queues, topics, durable subscriptions and fault-tolerant server pairs.
  typical_legacy_use: Messaging backbone of TIBCO-based integration estates in banking, telco and logistics, carrying transactions between BusinessWorks processes and core applications.
  capabilities: [jms-messaging, queues, topics, durable-subscriptions, fault-tolerance]
  possible_targets: [apache-kafka, confluent-cloud, azure-service-bus, amazon-sqs, amazon-sns, google-pubsub, activemq, rabbitmq]
  alternatives: [ibm-mq, activemq, rabbitmq]
  replaces: []
  suggested_next: [apache-kafka, azure-service-bus, confluent-cloud, tibco-businessworks]
  migration_considerations:
    - Inventory queues, topics, bridges, routes, selectors and durable subscribers, plus message volumes and size distributions.
    - Decide between JMS-compatible replacement (ActiveMQ/Amazon MQ, Service Bus JMS) for minimal change and re-architecture onto event streaming (Kafka) for new patterns.
    - Preserve delivery semantics (persistent, exactly-once expectations, ordering, redelivery and dead-letter behaviour).
    - Coordinate cutover with TIBCO BusinessWorks and other producers/consumers to avoid split-brain messaging.
  known_challenges:
    - Message selectors, request-reply and transactional sessions do not map directly to Kafka.
    - Undocumented consumers discovered late break integrations.
  risks: [integration-breakage, cutover-downtime, licensing-overlap, skills-gap]
  strategies: [retain, replatform, rearchitect, retire]
  skills: [JMS, TIBCO EMS administration, event-driven architecture]
  tags: [messaging, jms, legacy, tibco]
  docs:
    - title: TIBCO Enterprise Message Service documentation
      url: https://docs.tibco.com/products/tibco-enterprise-message-service

