- id: azure-service-bus
  name: Azure Service Bus
  aliases: [azure service bus, service bus, asb, service bus queues, service bus topics]
  vendor: Microsoft
  category: messaging
  role: streaming
  layer: ingestion
  environment: cloud
  legacy: false
  clouds: [azure]
  stage: null
  platforms: []
  operational_model: managed
  icon: mail
  color: "#0078D4"
  description: Fully managed enterprise message broker with queues and publish-subscribe topics, sessions, transactions, dead-lettering and JMS 2.0 support (Premium tier).
  typical_legacy_use: Azure target for JMS/MQ-style enterprise messaging, decoupling applications with reliable queues and topics.
  capabilities: [message-queuing, pub-sub-topics, sessions, dead-lettering, jms-support, transactions]
  possible_targets: []
  alternatives: [azure-event-hubs, amazon-sqs, rabbitmq, activemq, ibm-mq]
  replaces: [ibm-mq, tibco-ems, activemq, rabbitmq]
  suggested_next: [azure-functions, azure-monitor, private-connectivity]
  migration_considerations:
    - Use Premium tier for JMS 2.0, VNet integration, predictable throughput and large messages.
    - Map JMS features (selectors, request-reply, transactions) to Service Bus sessions, filters and transactions; test ordering and redelivery semantics.
    - Use Event Hubs, not Service Bus, for high-volume telemetry/event streaming.
  known_challenges:
    - Message size and throughput limits differ by tier.
    - Some JMS behaviours have subtle differences that surface only in failure tests.
  risks: [integration-breakage, cutover-downtime, vendor-lock-in]
  strategies: [replatform, refactor]
  skills: [Azure messaging, JMS]
  tags: [azure, messaging, queue, managed]
  docs:
    - title: Azure Service Bus documentation
      url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/

- id: amazon-sqs
  name: Amazon SQS
  aliases: [sqs, amazon sqs, aws sqs, simple queue service]
  vendor: Amazon Web Services
  category: messaging
  role: streaming
  layer: ingestion
  environment: cloud
  legacy: false
  clouds: [aws]
  stage: null
  platforms: []
  operational_model: serverless
  icon: mail
  color: "#E7157B"
  description: Fully managed, serverless message queuing service with standard (at-least-once) and FIFO (ordered, exactly-once processing) queues and dead-letter queues.
  typical_legacy_use: Decoupling microservices and buffering work for Lambda or container consumers, frequently paired with SNS for fan-out.
  capabilities: [message-queuing, fifo-queues, dead-lettering, serverless, long-polling]
  possible_targets: []
  alternatives: [azure-service-bus, rabbitmq, activemq, google-pubsub]
  replaces: [ibm-mq, tibco-ems, activemq, rabbitmq]
  suggested_next: [aws-lambda, amazon-sns, amazon-cloudwatch]
  migration_considerations:
    - SQS is not JMS; use Amazon MQ for lift-and-shift of JMS/AMQP applications and SQS for re-architected consumers.
    - Choose standard vs FIFO per queue based on ordering and throughput needs; design idempotent consumers.
    - Tune visibility timeouts and redrive policies against processing times.
  known_challenges:
    - Message size limit requires the extended-client pattern (payload in S3) for large messages.
    - No native pub/sub; fan-out requires SNS or EventBridge.
  risks: [integration-breakage, data-quality-regression]
  strategies: [refactor, rearchitect]
  skills: [AWS messaging, event-driven design]
  tags: [aws, messaging, queue, serverless]
  docs:
    - title: Amazon SQS documentation
      url: https://docs.aws.amazon.com/sqs/

- id: amazon-sns
  name: Amazon SNS
  aliases: [sns, amazon sns, aws sns, simple notification service]
  vendor: Amazon Web Services
  category: messaging
  role: streaming
  layer: ingestion
  environment: cloud
  legacy: false
  clouds: [aws]
  stage: null
  platforms: []
  operational_model: serverless
  icon: radio
  color: "#E7157B"
  description: Fully managed pub/sub messaging service that fans out messages from topics to SQS, Lambda, HTTP endpoints, email and mobile push, with standard and FIFO topics.
  typical_legacy_use: Event fan-out and notifications between AWS services and microservices, commonly in the SNS-to-SQS fan-out pattern.
  capabilities: [pub-sub, fan-out, message-filtering, fifo-topics, notifications]
  possible_targets: []
  alternatives: [google-pubsub, azure-service-bus, amazon-kinesis]
  replaces: [tibco-ems, ibm-mq]
  suggested_next: [amazon-sqs, aws-lambda, amazon-cloudwatch]
  migration_considerations:
    - Combine with SQS subscriptions for durability; SNS alone does not retain messages for later consumption.
    - Use subscription filter policies instead of per-consumer topics where possible.
    - Prefer EventBridge where content-based routing across many AWS services and SaaS sources is required; use SNS for high-throughput fan-out.
  known_challenges:
    - No replay or retention for analytics; use Kinesis or Kafka for event streaming needs.
    - Delivery retries to HTTP endpoints need dead-letter handling.
  risks: [integration-breakage, data-quality-regression]
  strategies: [refactor, rearchitect]
  skills: [AWS messaging]
  tags: [aws, messaging, pub-sub, serverless]
  docs:
    - title: Amazon SNS documentation
      url: https://docs.aws.amazon.com/sns/

# ---------------------------------------------------------------- BI / semantic layer
- id: ssrs
  name: SQL Server Reporting Services (SSRS)
  aliases: [ssrs, sql server reporting services, reporting services, rdl reports, ssrs reports]
  vendor: Microsoft
  category: bi
  role: bi
  layer: consumption
  environment: on-prem
  legacy: true
  clouds: [on-prem]
  stage: null
  platforms: []
  operational_model: self-managed
  icon: file-text
  color: "#CC2927"
  description: Microsoft's server-based paginated reporting platform where RDL reports, shared datasets and subscriptions are published to a report server; Microsoft has positioned Power BI Report Server as the on-premises reporting successor from SQL Server 2025.
  typical_legacy_use: Operational and regulatory pixel-perfect reports (statements, invoices, lists) against SQL Server and Oracle, delivered via email/file-share subscriptions.
  capabilities: [paginated-reports, subscriptions, parameterised-reports, report-server]
  possible_targets: [power-bi, microsoft-fabric]
  alternatives: [business-objects, cognos, microstrategy]
  replaces: []
  suggested_next: [power-bi, databricks-sql, azure-sql-database]
  migration_considerations:
    - Inventory reports, shared data sources, datasets, subscriptions and execution logs to retire unused reports before migrating.
    - RDL reports can be published as Power BI paginated reports (with Microsoft's migration tooling); rewrite data sources to point at the new platform.
    - Replace data-driven subscriptions, custom assemblies and embedded VB code with supported equivalents.
  known_challenges:
    - Report SQL often embeds business logic and source-specific T-SQL.
    - Custom code, custom assemblies and some subscription types are not supported in the Power BI service.
  risks: [report-parity, hidden-business-logic, sql-dialect-conversion]
  strategies: [retain, replatform, retire]
  skills: [SSRS, RDL, T-SQL, Power BI paginated reports]
  tags: [bi, reporting, paginated, legacy, microsoft]
  docs:
    - title: SQL Server Reporting Services documentation
      url: https://learn.microsoft.com/en-us/sql/reporting-services/

- id: ssas
  name: SQL Server Analysis Services (SSAS)
  aliases: [ssas, sql server analysis services, analysis services, ssas tabular, ssas multidimensional, azure analysis services, ssas cubes]
  vendor: Microsoft
  category: bi
  role: serving
  layer: serving
  environment: on-prem
  legacy: true
  clouds: [on-prem, azure]
  stage: null
  platforms: []
  operational_model: self-managed
  icon: box
  color: "#CC2927"
  description: Microsoft's analytical engine for OLAP — multidimensional cubes (MDX) and tabular models (DAX/VertiPaq) — also offered as the Azure Analysis Services PaaS for tabular models.
  typical_legacy_use: Semantic layer over SQL Server data warehouses feeding Excel pivot tables, SSRS and Power BI, with business measures defined in MDX or DAX.
  capabilities: [olap-cubes, tabular-models, semantic-layer, mdx, dax]
  possible_targets: [power-bi, microsoft-fabric, cube-dev, databricks-sql]
  alternatives: [cube-dev]
  replaces: []
  suggested_next: [power-bi, microsoft-fabric, databricks-sql]
  migration_considerations:
    - Tabular models migrate to Power BI/Fabric semantic models with relatively little change (XMLA endpoint, compatibility level checks).
    - Multidimensional cubes require redesign as tabular models; MDX calculations, scoped assignments and writeback have no direct equivalent.
    - Plan partition and refresh strategy (incremental refresh, Direct Lake or DirectQuery) on the target.
    - Re-point Excel and SSRS consumers that connect to the cube.
  known_challenges:
    - Complex MDX scripts and many-to-many dimensions are labour-intensive to re-express in DAX.
    - Azure Analysis Services users are being steered to Power BI/Fabric, so feature roadmaps favour the target.
  risks: [report-parity, hidden-business-logic, skills-gap]
  strategies: [retain, replatform, refactor, retire]
  skills: [SSAS, DAX, MDX, Power BI semantic models]
  tags: [olap, semantic-layer, legacy, microsoft]
  docs:
    - title: Analysis Services documentation
      url: https://learn.microsoft.com/en-us/analysis-services/

