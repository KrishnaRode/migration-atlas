- id: site-to-site-vpn
  name: Site-to-Site VPN
  aliases: [site to site vpn, ipsec vpn, s2s vpn, ha vpn]
  vendor: Generic
  category: cloud-networking
  role: network
  layer: security
  environment: hybrid
  legacy: false
  clouds: [aws, azure, gcp, on-prem]
  stage: null
  platforms: []
  operational_model: managed
  icon: network
  color: "#0D9488"
  description: Encrypted IPsec tunnels over the internet between on-premises networks and cloud VPCs/VNets (Google Cloud HA VPN, AWS Site-to-Site VPN, Azure VPN Gateway).
  typical_legacy_use: Provides quick-to-provision hybrid connectivity for early migration waves, low-volume integration or as backup to dedicated circuits.
  capabilities: [hybrid-connectivity, encryption, network-boundary]
  possible_targets: [google-cloud-interconnect, aws-direct-connect, azure-expressroute]
  alternatives: [google-cloud-interconnect, aws-direct-connect, azure-expressroute]
  replaces: []
  suggested_next: [google-vpc, aws-vpc, azure-vnet, private-connectivity]
  migration_considerations:
    - Validate throughput; per-tunnel bandwidth is limited (typically around 1.25 Gbps), so bulk migration may need multiple tunnels or dedicated circuits.
    - Deploy redundant tunnels and BGP dynamic routing for availability.
    - Use as a fast-start or backup path while dedicated interconnects are provisioned.
  known_challenges:
    - Internet-based latency and throughput variability affects CDC lag and large transfers.
    - Overlapping IP ranges between on-prem and cloud require NAT or readdressing.
  risks: [network-bandwidth, cdc-lag, data-volume-transfer]
  strategies: [rehost, replatform]
  skills: [Network engineering, IPsec, BGP]
  tags: [network, hybrid, vpn]
  docs:
    - title: Cloud VPN overview
      url: https://cloud.google.com/network-connectivity/docs/vpn/concepts/overview
    - title: What is AWS Site-to-Site VPN?
      url: https://docs.aws.amazon.com/vpn/latest/s2svpn/VPC_VPN.html

