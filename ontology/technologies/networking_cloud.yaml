      url: https://learn.microsoft.com/en-us/azure/

- id: google-cloud-interconnect
  name: Google Cloud Interconnect
  aliases: [cloud interconnect, google cloud interconnect, dedicated interconnect, partner interconnect]
  vendor: Google Cloud
  category: cloud-networking
  role: network
  layer: security
  environment: hybrid
  legacy: false
  clouds: [gcp]
  stage: null
  platforms: []
  operational_model: managed
  icon: network
  color: "#4285F4"
  description: Google Cloud's private, high-bandwidth hybrid connectivity via Dedicated Interconnect (10/100 Gbps circuits) or Partner Interconnect through service providers.
  typical_legacy_use: Connects on-prem data centres to GCP VPCs for bulk data migration, CDC replication and ongoing hybrid workloads with predictable latency.
  capabilities: [hybrid-connectivity, private-connectivity, network-boundary, high-bandwidth]
  possible_targets: []
  alternatives: [site-to-site-vpn]
  replaces: []
  suggested_next: [google-vpc, vpc-service-controls, google-cloud-storage, google-datastream]
  migration_considerations:
    - Size bandwidth from data-transfer volumes and CDC throughput, with redundant connections for the 99.99% SLA topology.
    - Provisioning (cross-connects, LOAs) can take weeks; start early in the programme.
    - Use Cloud Router with BGP and plan non-overlapping IP ranges with on-prem.
  known_challenges:
    - Lead times for physical circuits often delay migration waves.
    - Interconnect traffic is not encrypted by default; use MACsec or HA VPN over Interconnect where required.
  risks: [network-bandwidth, cutover-downtime, security-gap]
  strategies: [relocate, rehost, replatform]
  skills: [Google Cloud networking, BGP, Network engineering]
  tags: [network, hybrid, gcp]
  docs:
    - title: Cloud Interconnect documentation
      url: https://cloud.google.com/network-connectivity/docs/interconnect

- id: aws-direct-connect
  name: AWS Direct Connect
  aliases: [direct connect, aws direct connect, dx]
  vendor: Amazon Web Services
  category: cloud-networking
  role: network
  layer: security
  environment: hybrid
  legacy: false
  clouds: [aws]
  stage: null
  platforms: []
  operational_model: managed
  icon: network
  color: "#8C4FFF"
  description: AWS dedicated network connection service linking on-premises networks to AWS over private circuits at Direct Connect locations.
  typical_legacy_use: Provides consistent, private connectivity for migrating large data volumes and running hybrid workloads between data centres and AWS VPCs.
  capabilities: [hybrid-connectivity, private-connectivity, network-boundary, high-bandwidth]
  possible_targets: []
  alternatives: [site-to-site-vpn]
  replaces: []
  suggested_next: [aws-vpc, private-connectivity, amazon-s3, aws-dms]
  migration_considerations:
    - Use Direct Connect gateways and Transit Gateway to reach multiple VPCs and Regions.
    - Design for resilience with connections at multiple locations, or a VPN backup.
    - Plan bandwidth for initial bulk load, CDC and parallel-run reconciliation traffic.
  known_challenges:
    - Physical provisioning through partners can take weeks to months.
    - Direct Connect is not encrypted by default; MACsec or VPN over DX is needed for encryption.
  risks: [network-bandwidth, cutover-downtime, security-gap]
  strategies: [relocate, rehost, replatform]
  skills: [AWS networking, BGP, Network engineering]
  tags: [network, hybrid, aws]
  docs:
    - title: AWS Direct Connect documentation
      url: https://docs.aws.amazon.com/directconnect/

