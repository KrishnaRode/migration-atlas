- id: aws-vpc
  name: Amazon VPC
  aliases: [aws vpc, amazon vpc, amazon virtual private cloud]
  vendor: Amazon Web Services
  category: cloud-networking
  role: network
  layer: security
  environment: cloud
  legacy: false
  clouds: [aws]
  stage: null
  platforms: []
  operational_model: managed
  icon: network
  color: "#8C4FFF"
  description: AWS logically isolated virtual network with subnets, route tables, security groups, NACLs, gateway and interface endpoints.
  typical_legacy_use: Hosts data-platform compute (EMR, Glue connections, Redshift, MWAA) in private subnets with endpoints to S3 and other services.
  capabilities: [network-boundary, private-connectivity, firewall, network-segmentation]
  possible_targets: []
  alternatives: [google-vpc, azure-vnet]
  replaces: []
  suggested_next: [aws-direct-connect, private-connectivity, site-to-site-vpn, aws-iam]
  migration_considerations:
    - Use Transit Gateway for hub-and-spoke connectivity across many VPCs and accounts.
    - Plan CIDR allocation with IPAM to avoid overlaps with on-prem and other VPCs.
    - Add S3 gateway endpoints and interface endpoints to keep data traffic private and reduce NAT costs.
  known_challenges:
    - NAT gateway data-processing charges for large data movement.
    - Security group and NACL complexity across many accounts.
  risks: [security-gap, cost-overrun]
  strategies: [replatform, rearchitect]
  skills: [AWS networking]
  tags: [network, vpc, aws]
  docs:
