  operational_model: managed
  icon: network
  color: "#4285F4"
  description: Google Cloud's global software-defined virtual network with regional subnets, firewall policies, Cloud NAT, Private Google Access and Shared VPC.
  typical_legacy_use: Provides the network foundation for GCP data platforms, with Shared VPC host projects serving many service projects.
  capabilities: [network-boundary, private-connectivity, firewall, network-segmentation]
  possible_targets: []
