  operational_model: managed
  icon: cloud
  color: "#0078D4"
  description: Microsoft's public cloud platform, integrating with Entra ID and Microsoft 365, and offering analytics through Fabric, Synapse, Data Factory and Azure Databricks.
  typical_legacy_use: Chosen by Microsoft-centric enterprises to modernise SQL Server, SSIS and on-prem BI estates into ADLS, Data Factory, Fabric and Power BI.
  capabilities: [cloud-platform, compute, object-storage, analytics, identity, networking, managed-services]
  possible_targets: []
  alternatives: [gcp, aws]
  replaces: []
  suggested_next: [adls-gen2, azure-event-hubs, azure-synapse, azure-data-factory, azure-key-vault, azure-monitor, microsoft-purview, microsoft-entra-id, azure-expressroute, microsoft-fabric]
  migration_considerations:
    - Deploy an Azure landing zone (management groups, subscriptions, hub-and-spoke networking, Azure Policy) first.
    - Plan ExpressRoute or VPN capacity and private endpoints for PaaS data services.
    - Leverage Azure Hybrid Benefit for existing Windows Server and SQL Server licences.
    - Align identity with Entra ID and use managed identities for service-to-service access.
  known_challenges:
    - Overlapping analytics services (Synapse, Fabric, Databricks) complicate target-platform decisions.
    - Private endpoint and DNS design for PaaS services is a frequent source of delays.
  risks: [skills-gap, cost-overrun, vendor-lock-in, network-bandwidth]
  strategies: [rehost, replatform, refactor, rearchitect]
