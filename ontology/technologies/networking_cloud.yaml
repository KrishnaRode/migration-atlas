# Hyperscaler platforms (cloud-platform role) and cloud networking / hybrid connectivity.

- id: gcp
  name: Google Cloud
  aliases: [google cloud, gcp, google cloud platform]
  vendor: Google Cloud
  category: cloud-platforms
  role: cloud-platform
  layer: operations
  environment: cloud
  legacy: false
  clouds: [gcp]
  stage: null
  platforms: []
  operational_model: managed
  icon: cloud
  color: "#4285F4"
  description: Google's public cloud platform, offering serverless analytics (BigQuery), streaming (Pub/Sub, Dataflow), AI (Vertex AI) and global networking.
  typical_legacy_use: Chosen as the target for data-warehouse and analytics modernisation, especially Teradata, Netezza and Hadoop migrations to BigQuery and Dataproc.
  capabilities: [cloud-platform, compute, object-storage, analytics, identity, networking, managed-services]
  possible_targets: []
  alternatives: [aws, azure]
  replaces: []
  suggested_next: [google-cloud-storage, google-pubsub, bigquery, google-dataflow, cloud-composer, google-secret-manager, google-cloud-monitoring, google-dataplex, google-iam, google-cloud-interconnect]
  migration_considerations:
    - Establish a landing zone (organisation, folders, projects, Shared VPC, IAM, logging) before migrating workloads.
    - Plan hybrid connectivity (Cloud Interconnect or HA VPN) and bandwidth for bulk data transfer.
    - Use VPC Service Controls and CMEK where data residency or exfiltration controls are required.
    - Model costs for BigQuery (on-demand vs editions) and egress early.
  known_challenges:
    - Teams need retraining on GCP IAM, networking and serverless operating models.
    - Mapping legacy security zones to projects and perimeters requires architectural decisions.
  risks: [skills-gap, cost-overrun, vendor-lock-in, network-bandwidth]
  strategies: [rehost, replatform, refactor, rearchitect]
  skills: [Google Cloud architecture, Cloud networking, Google Cloud IAM]
  tags: [cloud, hyperscaler, gcp]
  docs:
    - title: Google Cloud documentation
      url: https://cloud.google.com/docs

- id: aws
  name: Amazon Web Services
  aliases: [amazon web services, aws]
  vendor: Amazon Web Services
  category: cloud-platforms
  role: cloud-platform
  layer: operations
  environment: cloud
  legacy: false
  clouds: [aws]
  stage: null
  platforms: []
  operational_model: managed
  icon: cloud
  color: "#FF9900"
  description: Amazon's public cloud platform with the broadest catalogue of compute, storage, database, analytics (S3, Glue, Redshift, EMR) and AI services.
  typical_legacy_use: Chosen as the target for data-centre exits and data-lake modernisation, typically centred on S3 with Glue, EMR, Redshift and Athena.
  capabilities: [cloud-platform, compute, object-storage, analytics, identity, networking, managed-services]
  possible_targets: []
  alternatives: [gcp, azure]
  replaces: []
  suggested_next: [amazon-s3, amazon-kinesis, amazon-redshift, aws-glue, amazon-mwaa, aws-secrets-manager, amazon-cloudwatch, aws-lake-formation, aws-iam, aws-direct-connect]
  migration_considerations:
    - Build a multi-account landing zone (AWS Organizations, Control Tower, SCPs) before migrating workloads.
    - Plan Direct Connect or Site-to-Site VPN capacity, and offline transfer (Snowball) for very large volumes.
    - Standardise encryption with KMS and centralise logging with CloudTrail and CloudWatch.
    - Use migration programmes and tooling (AWS DMS, Application Migration Service) per workload.
  known_challenges:
    - Service sprawl makes reference-architecture choices difficult without strong standards.
    - Data egress and cross-AZ transfer costs are often underestimated.
  risks: [skills-gap, cost-overrun, vendor-lock-in, network-bandwidth]
  strategies: [rehost, replatform, refactor, rearchitect]
  skills: [AWS architecture, AWS networking, AWS IAM]
  tags: [cloud, hyperscaler, aws]
  docs:
    - title: AWS documentation
      url: https://docs.aws.amazon.com/

- id: azure
  name: Microsoft Azure
  aliases: [microsoft azure, azure]
  vendor: Microsoft
  category: cloud-platforms
  role: cloud-platform
