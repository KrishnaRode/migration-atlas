- id: fivetran
  name: Fivetran
  aliases: [fivetran, fivetran hvr, hvr, fivetran connectors]
  vendor: Fivetran
  category: cdc
  role: cdc
  layer: ingestion
  environment: saas
  legacy: false
  clouds: [aws, azure, gcp]
  stage: null
  platforms: []
  operational_model: saas
  icon: refresh-cw
  color: "#0073FF"
  description: Fully managed ELT service with hundreds of pre-built connectors that replicate SaaS applications, databases (including log-based CDC via its HVR technology), files and events into a cloud warehouse or lake.
  typical_legacy_use: Replaces hand-built extract scripts and on-prem ETL extract layers, landing SaaS (Salesforce, NetSuite, Workday) and database changes into Snowflake, Databricks, BigQuery or Redshift for in-warehouse transformation with dbt.
  capabilities: [managed-connectors, log-based-cdc, schema-drift-handling, incremental-sync, saas-ingestion, history-mode]
  possible_targets: []
  alternatives: [airbyte, lakeflow-connect, qlik-replicate, matillion, striim]
  replaces: [informatica-powercenter, ssis, talend, oracle-data-integrator, sap-data-services]
  suggested_next: [dbt, snowflake, databricks, bigquery, delta-bronze, landing-zone]
  migration_considerations:
    - Pricing is consumption-based (monthly active rows per connection); profile change volumes of high-churn tables before committing to a connector-per-source design.
    - Decide where Fivetran's runtime runs (fully SaaS, hybrid deployment agent, or self-hosted HVR) to satisfy data-residency and network constraints for on-prem databases.
    - Fivetran lands data close to source schema; plan the transformation layer (dbt, Lakeflow Declarative Pipelines) separately rather than expecting ETL-style logic.
    - Agree soft-delete, history-mode and schema-change behaviour per connector so downstream models handle them consistently.
  known_challenges:
    - Very large initial historical syncs can take days and may need to be staged or seeded from a bulk export.
    - Connector-level configuration offers limited control over column-level transformation and filtering compared with a full ETL tool.
    - Costs can grow unexpectedly when wide, frequently updated tables are synced.
  risks: [cost-overrun, cdc-lag, schema-drift, vendor-lock-in, security-gap]
  strategies: [repurchase, replatform]
  skills: [Fivetran administration, SQL, dbt]
  tags: [elt, cdc, saas, connectors, modern]
  docs:
    - title: Fivetran documentation
      url: https://fivetran.com/docs

