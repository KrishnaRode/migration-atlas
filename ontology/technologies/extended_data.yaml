- id: apache-hive
  name: Apache Hive
  aliases: [apache hive, hiveql, hive sql, hive metastore, hive llap, hive tables, hive on tez]
  vendor: Apache Software Foundation
  category: processing
  role: processing
  layer: processing
  environment: on-prem
  legacy: true
  clouds: [on-prem, aws, azure, gcp]
  stage: null
  platforms: []
  operational_model: self-managed
  icon: database
  color: "#FDEE21"
  description: SQL-on-Hadoop data warehouse system that compiles HiveQL into Tez, MapReduce or Spark jobs over HDFS/object storage, with the Hive Metastore as the de-facto table catalog of the Hadoop ecosystem.
  typical_legacy_use: Batch ELT and reporting tables on Cloudera/Hortonworks clusters, with HiveQL scripts scheduled by Oozie and partitioned ORC/Parquet tables shared through the Hive Metastore.
  capabilities: [sql-on-hadoop, batch-sql, metastore, acid-tables, partitioning]
  possible_targets: [databricks, databricks-sql, delta-lake, bigquery, google-dataproc, amazon-emr, trino, apache-iceberg, snowflake]
  alternatives: [apache-impala, presto, trino, apache-spark]
  replaces: []
  suggested_next: [databricks, unity-catalog, delta-lake, lakeflow-declarative-pipelines, databricks-workflows]
  migration_considerations:
    - Inventory databases, managed vs external tables, partitions, UDFs and SerDes from the Hive Metastore; this is the backbone of the migration plan.
    - Convert HiveQL to Spark SQL / Databricks SQL or BigQuery SQL; most DDL/DML translates, but custom UDFs, SerDes and transform scripts need rework.
    - Move data from HDFS to object storage and convert ORC/Parquet tables to Delta or Iceberg; Hive ACID (ORC transactional) tables need compaction and export, not file copy.
    - Replace Oozie/cron scheduling of HiveQL scripts with a modern orchestrator, and Ranger/Sentry policies with the target catalog's access model.
  known_challenges:
    - Hive ACID tables and their delta files cannot be read reliably by other engines without major compaction.
    - Small-file problems and over-partitioned tables degrade performance after a lift-and-shift.
    - Custom Java UDFs and SerDes are often undocumented.
  risks: [sql-dialect-conversion, data-volume-transfer, governance-gap, scheduling-dependency-loss, performance-regression]
  strategies: [retain, rehost, replatform, refactor, rearchitect, retire]
  skills: [HiveQL, Hadoop administration, Spark SQL]
  tags: [hadoop, sql-on-hadoop, legacy, batch]
  docs:
    - title: Apache Hive documentation
      url: https://cwiki.apache.org/confluence/display/Hive/Home

