  description: Open-source data movement platform (self-managed or Airbyte Cloud) offering a large catalogue of source and destination connectors, incremental sync and Debezium-based CDC for databases.
  typical_legacy_use: Used by engineering-led teams wanting an open-source, extensible alternative to commercial ELT services, often deployed on Kubernetes alongside Airflow or Dagster.
  capabilities: [managed-connectors, open-source-connectors, log-based-cdc, incremental-sync, connector-development-kit]
