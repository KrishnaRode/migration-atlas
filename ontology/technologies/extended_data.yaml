# ---------------------------------------------------------------- Query engines / lake formats / real-time analytics
- id: trino
  name: Trino
  aliases: [trino, trinodb, prestosql, trino cluster]
  vendor: Trino Software Foundation
  category: processing
  role: serving
  layer: serving
  environment: any
  legacy: false
  clouds: [on-prem, aws, azure, gcp]
  stage: null
  platforms: []
  operational_model: self-managed
  icon: search
  color: "#DD00A1"
  description: Open-source distributed SQL query engine (the fork formerly known as PrestoSQL) for interactive and federated queries over data lakes (Iceberg, Delta, Hive) and many other connectors.
  typical_legacy_use: Interactive SQL over Hadoop/Hive or S3 data lakes, federating queries across lake and operational databases without moving data.
  capabilities: [federated-query, interactive-sql, iceberg-support, delta-support, connector-framework]
  possible_targets: [starburst, databricks-sql, amazon-athena]
  alternatives: [presto, starburst, dremio, amazon-athena, databricks-sql]
  replaces: [apache-hive, apache-impala, presto, cloudera-hadoop]
  suggested_next: [apache-iceberg, amazon-s3, aws-glue-data-catalog, starburst, tableau]
  migration_considerations:
    - Choose the table format and catalog (Iceberg REST, Hive Metastore, Glue, Unity Catalog) first; Trino reads what the catalog exposes.
    - Size coordinator and workers for concurrency; enable fault-tolerant execution for long-running ETL-style queries.
    - Translate HiveQL/Impala SQL to Trino SQL; functions, implicit casts and complex-type handling differ.
  known_challenges:
    - Self-managed clusters need tuning of memory limits, spill and autoscaling for mixed workloads.
    - Fine-grained access control requires an external policy system (e.g. Ranger, OPA or a commercial distribution).
  risks: [sql-dialect-conversion, performance-regression, operational-readiness, governance-gap]
  strategies: [replatform, refactor]
  skills: [Trino, SQL, lake table formats, Kubernetes]
  tags: [query-engine, federated, open-source, lakehouse, modern]
  docs:
    - title: Trino documentation
      url: https://trino.io/docs/current/

