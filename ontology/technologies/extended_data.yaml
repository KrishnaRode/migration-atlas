  description: Massively parallel, low-latency SQL engine for Hadoop that queries Parquet/Kudu/HBase tables registered in the Hive Metastore, primarily shipped by Cloudera.
  typical_legacy_use: Interactive BI over Hadoop data, serving Tableau, Qlik or MicroStrategy dashboards directly from Parquet tables on CDH/CDP clusters.
  capabilities: [interactive-sql, mpp-query, kudu-integration, metastore-integration]
