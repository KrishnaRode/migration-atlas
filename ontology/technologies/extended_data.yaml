  icon: workflow
  color: "#C74634"
  description: Oracle's E-LT data integration tool that generates set-based SQL executed on source and target databases through reusable Knowledge Modules, with packages, scenarios and load plans for control flow.
  typical_legacy_use: Loads Oracle-based data warehouses and Oracle BI Applications, often tightly coupled to Oracle Database, Exadata and Oracle EBS/Fusion sources.
  capabilities: [elt, pushdown-transformation, knowledge-modules, load-plans, metadata-repository]
  possible_targets: [dbt, lakeflow-declarative-pipelines, databricks-workflows, azure-data-factory, aws-glue, informatica-idmc, matillion]
  alternatives: [informatica-powercenter, ibm-datastage, ssis, talend, sap-data-services]
  replaces: []
  suggested_next: [dbt, lakeflow-declarative-pipelines, databricks-workflows, lakeflow-connect, oracle-goldengate]
  migration_considerations:
    - Export the master and work repositories to inventory mappings, interfaces (11g), procedures, packages, load plans and customised Knowledge Modules.
    - Because ODI generates SQL in the Oracle dialect, the generated code is a useful conversion input but must be translated to the target SQL dialect.
    - Customised Knowledge Modules and ODI procedures often hold Jython/Groovy or PL/SQL logic that needs manual rewrite.
    - Map load plans, scenarios and ODI agents' schedules onto the target orchestrator.
  known_challenges:
    - Heavy use of Oracle-specific features (MERGE hints, DB links, PL/SQL calls) ties pipelines to Oracle.
    - Repository metadata spans many versions of interfaces/mappings, making automated conversion uneven.
  risks: [hidden-business-logic, sql-dialect-conversion, stored-procedure-rewrite, scheduling-dependency-loss, skills-gap]
