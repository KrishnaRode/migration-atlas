  description: AWS managed relational database service for PostgreSQL, MySQL, MariaDB, Oracle, SQL Server and Db2, handling provisioning, patching, backups and Multi-AZ high availability.
  typical_legacy_use: Rehost/replatform target for on-prem Oracle, SQL Server, MySQL and PostgreSQL databases that keep their engine.
  capabilities: [managed-rdbms, multi-az, read-replicas, automated-backups, multiple-engines]
  possible_targets: [amazon-aurora]
  alternatives: [amazon-aurora, azure-sql-database, cloud-sql, azure-postgresql, oracle-autonomous-database]
  replaces: [oracle-database, sql-server, mysql, postgresql, ibm-db2]
  suggested_next: [aws-dms, amazon-cloudwatch, aws-kms, aws-secrets-manager]
  migration_considerations:
    - Choose engine, licensing model (licence-included vs BYOL) and RDS vs RDS Custom based on required OS/DB access.
    - Use AWS DMS (with Schema Conversion for heterogeneous moves) or native replication for low-downtime cutover.
    - Validate unsupported features (e.g. some Oracle options, SQL Server Agent/SSIS limits, file-system access).
  known_challenges:
    - Lack of OS access breaks agents, file-based integrations and some admin scripts.
    - Storage and IOPS provisioning needs tuning to avoid performance regression.
  risks: [cutover-downtime, performance-regression, licensing-overlap]
  strategies: [rehost, replatform]
  skills: [AWS RDS, DBA]
  tags: [aws, rdbms, managed]
  docs:
    - title: Amazon RDS documentation
      url: https://docs.aws.amazon.com/rds/
