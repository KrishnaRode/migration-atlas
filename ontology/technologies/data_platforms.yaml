  icon: warehouse
  color: "#8C4FFF"
  description: Managed MPP columnar data warehouse on AWS (RA3 provisioned or Serverless) with Spectrum for S3 data lakes, zero-ETL integrations and data sharing.
  typical_legacy_use: AWS-native warehouse target for Teradata, Netezza, Oracle and SQL Server analytics, often with S3 data lakes queried via Spectrum.
  capabilities: [cloud-data-warehouse, mpp, redshift-spectrum, zero-etl, data-sharing, materialized-views]
  possible_targets: [databricks, snowflake]
  alternatives: [snowflake, databricks, bigquery, azure-synapse]
  replaces: [teradata, netezza, greenplum, oracle-exadata]
  suggested_next: [dbt, aws-glue, amazon-quicksight, aws-lake-formation, amazon-mwaa]
  migration_considerations:
    - Use AWS Schema Conversion Tool and DMS for schema conversion and data movement from on-prem EDWs.
    - Choose distribution and sort keys (or AUTO) carefully; legacy PI/distribution designs need re-evaluation.
    - Decide between provisioned RA3 and Serverless based on concurrency and workload pattern.
  known_challenges:
    - Stored procedures and complex PL/pgSQL-style logic require manual conversion.
    - Concurrency scaling and WLM tuning are needed for mixed workloads.
  risks: [sql-dialect-conversion, stored-procedure-rewrite, performance-regression, vendor-lock-in]
  strategies: [replatform, refactor]
