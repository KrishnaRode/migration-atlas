# Cloud data platforms (lakehouses and warehouses) and legacy Hadoop distributions.
- id: databricks
  name: Databricks Data Intelligence Platform
  aliases: [databricks, dbx, databricks lakehouse, azure databricks, databricks platform]
  vendor: Databricks
  category: data-platforms
  role: lakehouse
  layer: processing
  environment: cloud
  legacy: false
  clouds: [aws, azure, gcp]
  stage: null
  platforms: []
  operational_model: managed
  icon: sparkles
  color: "#FF3621"
  description: Unified lakehouse platform built on Apache Spark, Delta Lake and Unity Catalog for data engineering, SQL warehousing, streaming and machine learning on open formats.
  typical_legacy_use: Modernisation target consolidating legacy EDW appliances, Hadoop clusters and ETL tools onto a governed medallion lakehouse with serverless compute.
  capabilities: [lakehouse, batch-processing, stream-processing, sql-warehousing, machine-learning, unified-governance, serverless-compute, open-table-formats]
  possible_targets: []
  alternatives: [snowflake, bigquery, microsoft-fabric, amazon-redshift, azure-synapse]
  replaces: [teradata, netezza, greenplum, oracle-exadata, cloudera-hadoop, hdfs, informatica-powercenter, ibm-datastage, ab-initio]
  suggested_next: [unity-catalog, databricks-workflows, delta-lake, databricks-sql, mlflow, lakeflow-declarative-pipelines, delta-bronze, databricks-asset-bundles, lakeflow-connect, databricks-auto-loader, lakehouse-monitoring]
  migration_considerations:
    - Establish Unity Catalog metastore, catalogs per environment/domain and external locations before migrating any data.
    - Convert legacy SQL (Teradata BTEQ, PL/SQL, T-SQL) to Databricks SQL / PySpark using automated converters plus manual review of stored procedures.
    - Re-implement ETL as Lakeflow Declarative Pipelines or notebooks/jobs orchestrated by Databricks Workflows, deployed through Asset Bundles.
    - Use serverless SQL warehouses and job compute with cluster policies and budgets to control cost.
    - Plan reconciliation (row counts, checksums, aggregates) and a parallel run per subject area before decommissioning legacy.
  known_challenges:
    - Stored-procedure-heavy warehouses need significant refactoring into set-based SQL or Python.
    - Workspace, networking (PrivateLink, customer-managed VPC/VNet) and identity setup is non-trivial in regulated environments.
    - Teams new to Spark need guidance on performance tuning, file layout and cost management.
  risks: [sql-dialect-conversion, stored-procedure-rewrite, skills-gap, cost-overrun, parallel-run-cost, governance-gap]
  strategies: [replatform, refactor, rearchitect]
  skills: [Databricks, Apache Spark, Delta Lake, Unity Catalog, PySpark, Databricks SQL]
  tags: [lakehouse, databricks, spark, modern, data-platform]
  docs:
    - title: Databricks documentation
      url: https://docs.databricks.com/

- id: snowflake
  name: Snowflake
  aliases: [snowflake, snowflake data cloud, snowflake ai data cloud, sf dwh]
  vendor: Snowflake
  category: data-warehouse
  role: warehouse
  layer: processing
  environment: saas
  legacy: false
  clouds: [aws, azure, gcp]
  stage: null
  platforms: []
  operational_model: saas
  icon: snowflake
  color: "#29B5E8"
  description: Fully managed cloud data platform separating storage and elastic virtual-warehouse compute, with secure data sharing, Snowpark and Iceberg table support.
  typical_legacy_use: Modernisation target for on-prem EDWs (Teradata, Netezza, Oracle, SQL Server) where SQL-centric teams want minimal operations.
  capabilities: [cloud-data-warehouse, elastic-compute, data-sharing, time-travel, snowpark, iceberg-tables, semi-structured-data]
  possible_targets: []
  alternatives: [databricks, bigquery, amazon-redshift, azure-synapse, microsoft-fabric]
  replaces: [teradata, netezza, greenplum, oracle-exadata]
  suggested_next: [dbt, snowpipe, snowflake-horizon, apache-airflow, tableau, power-bi]
  migration_considerations:
    - Use SnowConvert or equivalent tooling for DDL, SQL and stored-procedure conversion; validate procedural logic manually.
    - Design warehouse sizing, multi-cluster settings and auto-suspend per workload to control credit consumption.
    - Map legacy roles to Snowflake RBAC hierarchy and apply masking/row-access policies via Horizon.
    - Load history via staged files (COPY INTO) and incrementals via Snowpipe / Snowpipe Streaming or CDC tools.
  known_challenges:
    - Teradata-style workload management and indexing strategies do not translate; performance tuning relies on clustering and warehouse sizing.
    - Credit consumption can escalate without resource monitors and governance.
  risks: [sql-dialect-conversion, stored-procedure-rewrite, cost-overrun, vendor-lock-in, data-type-mismatch]
  strategies: [replatform, refactor, repurchase]
  skills: [Snowflake SQL, Snowpark, dbt, Snowflake RBAC]
  tags: [warehouse, snowflake, saas, modern]
  docs:
    - title: Snowflake documentation
      url: https://docs.snowflake.com/

- id: bigquery
  name: Google BigQuery
  aliases: [bigquery, bq, big query, google bigquery]
  vendor: Google Cloud
  category: data-warehouse
  role: warehouse
  layer: processing
  environment: cloud
  legacy: false
  clouds: [gcp]
  stage: null
  platforms: []
  operational_model: serverless
  icon: warehouse
  color: "#669DF6"
  description: Serverless, columnar cloud data warehouse on Google Cloud with separated storage and slot-based compute, BigLake/Iceberg tables, BigQuery ML and streaming ingestion.
  typical_legacy_use: Modernisation target for Teradata, Netezza, Oracle and Hadoop/Hive workloads on Google Cloud, with Looker and Dataform for semantic modelling and transformation.
  capabilities: [cloud-data-warehouse, serverless-sql, streaming-ingestion, biglake, bigquery-ml, materialized-views, row-column-security]
  possible_targets: []
  alternatives: [snowflake, databricks, amazon-redshift, azure-synapse]
  replaces: [teradata, netezza, greenplum, oracle-exadata, cloudera-hadoop]
  suggested_next: [dataform, dbt, google-dataplex, looker, cloud-composer, google-dataflow, google-datastream]
  migration_considerations:
    - Use the BigQuery Migration Service (batch and interactive SQL translation) for Teradata, Oracle, Netezza and other dialects.
    - Choose on-demand versus capacity (Editions/reservations) pricing per workload and set quotas.
    - Design partitioning and clustering for each large table; legacy indexes and PI/AMP distribution have no equivalent.
    - Validate migrated data with the Data Validation Tool (google-dvt) before cutover.
  known_challenges:
    - Procedural logic (BTEQ, PL/SQL) must be rewritten as BigQuery scripting, stored procedures or Dataform/dbt models.
    - DML concurrency and mutation quotas affect high-frequency update patterns.
  risks: [sql-dialect-conversion, stored-procedure-rewrite, cost-overrun, vendor-lock-in, data-type-mismatch]
  strategies: [replatform, refactor, rearchitect]
  skills: [BigQuery SQL, Dataform, GCP IAM, Looker]
  tags: [warehouse, bigquery, serverless, gcp, modern]
  docs:
    - title: BigQuery documentation
      url: https://cloud.google.com/bigquery/docs

- id: amazon-redshift
  name: Amazon Redshift
  aliases: [redshift, amazon redshift, redshift serverless, aws redshift]
