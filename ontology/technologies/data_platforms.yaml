- id: azure-synapse
  name: Azure Synapse Analytics
  aliases: [synapse, azure synapse, synapse analytics, azure sql data warehouse, dedicated sql pool]
  vendor: Microsoft
  category: data-warehouse
  role: warehouse
  layer: processing
  environment: cloud
  legacy: false
  clouds: [azure]
  stage: null
  platforms: []
  operational_model: managed
  icon: warehouse
  color: "#0078D4"
  description: Azure analytics service combining dedicated and serverless SQL pools, Apache Spark pools and pipelines; Microsoft now positions Fabric as its successor for new workloads.
  typical_legacy_use: Azure warehouse for SQL Server, Teradata and Netezza migrations using dedicated SQL pools, often with ADF/Synapse pipelines and Power BI.
  capabilities: [cloud-data-warehouse, mpp, serverless-sql, spark-pools, synapse-pipelines]
  possible_targets: [microsoft-fabric, databricks, snowflake]
  alternatives: [microsoft-fabric, databricks, snowflake, amazon-redshift, bigquery]
  replaces: [teradata, netezza, sql-server, oracle-exadata]
  suggested_next: [power-bi, azure-data-factory, microsoft-purview, microsoft-fabric]
  migration_considerations:
    - For new programmes evaluate Microsoft Fabric or Azure Databricks first; Synapse dedicated pools receive limited new investment.
    - Existing dedicated pools can be migrated to Fabric Warehouse using Microsoft's migration assistant.
    - Distribution (hash, round-robin, replicated) and columnstore design drive dedicated-pool performance.
  known_challenges:
    - T-SQL surface area in dedicated pools is a subset of SQL Server; some features need rework.
    - Pausing and scaling dedicated pools affects availability and cost planning.
  risks: [vendor-lock-in, sql-dialect-conversion, performance-regression, skills-gap]
  strategies: [retain, replatform, refactor]
  skills: [T-SQL, Azure Synapse, Azure Data Factory, Power BI]
  tags: [warehouse, synapse, azure, mpp]
  docs:
    - title: Azure Synapse Analytics documentation
      url: https://learn.microsoft.com/azure/synapse-analytics/

- id: microsoft-fabric
  name: Microsoft Fabric
  aliases: [fabric, microsoft fabric, ms fabric, onelake]
  vendor: Microsoft
  category: data-platforms
  role: lakehouse
  layer: processing
  environment: saas
  legacy: false
  clouds: [azure]
  stage: null
  platforms: []
  operational_model: saas
  icon: layers
  color: "#117865"
  description: SaaS analytics platform unifying OneLake (Delta-based storage), Data Factory, Lakehouse, Warehouse, Real-Time Intelligence and Power BI under capacity-based licensing.
  typical_legacy_use: Microsoft-centric modernisation target for SQL Server, SSIS, Synapse and Power BI estates seeking a single SaaS analytics experience.
  capabilities: [lakehouse, data-warehouse, onelake, data-pipelines, real-time-analytics, direct-lake, power-bi-integration]
  possible_targets: []
  alternatives: [databricks, snowflake, azure-synapse, bigquery]
  replaces: [azure-synapse, ssis, sql-server, teradata, netezza]
  suggested_next: [power-bi, microsoft-purview, azure-data-factory, adls-gen2, databricks]
  migration_considerations:
    - Size Fabric capacity (F SKUs) per workload; capacity throttling and smoothing affect concurrent workloads.
    - Use OneLake shortcuts to ADLS Gen2, S3 or Databricks-managed Delta tables to avoid copying data.
    - Migrate SSIS packages via Fabric Data Factory (including SSIS lift-and-shift options) or rewrite as pipelines/dataflows.
    - Plan Power BI Direct Lake semantic models on top of lakehouse/warehouse tables.
  known_challenges:
    - Platform is evolving quickly; feature gaps and preview features need careful assessment for production.
    - Capacity-based cost model requires governance across shared workspaces.
  risks: [vendor-lock-in, operational-readiness, cost-overrun, governance-gap]
  strategies: [repurchase, replatform, rearchitect]
  skills: [Microsoft Fabric, Power BI, T-SQL, PySpark]
  tags: [lakehouse, saas, microsoft, onelake]
  docs:
    - title: Microsoft Fabric documentation
      url: https://learn.microsoft.com/fabric/

- id: cloudera-hadoop
  name: Cloudera / Hadoop (CDH, HDP, CDP)
  aliases: [cloudera, hadoop, cdh, hdp, cdp, hortonworks, hive, impala]
  vendor: Cloudera
  category: data-platforms
  role: processing
  layer: processing
  environment: on-prem
  legacy: true
  clouds: [on-prem]
  stage: null
  platforms: []
  operational_model: self-managed
  icon: database
  color: "#F96702"
  description: On-premises Hadoop distribution bundling HDFS, YARN, Hive, Impala, Spark, HBase, Oozie and Ranger for large-scale batch processing and SQL-on-Hadoop.
  typical_legacy_use: Enterprise data lakes built 2012-2020 for ETL offload, log analytics and Hive/Impala reporting, often with Oozie scheduling and Sqoop ingestion from RDBMS sources.
  capabilities: [distributed-processing, sql-on-hadoop, batch-etl, nosql-hbase, yarn-resource-management]
  possible_targets: [databricks, google-dataproc, amazon-emr, bigquery, snowflake, microsoft-fabric]
  alternatives: []
  replaces: []
  suggested_next: [databricks, delta-lake, google-dataproc, amazon-emr, apache-spark]
  migration_considerations:
    - Inventory Hive/Impala tables, Spark/MapReduce jobs, Oozie workflows, Sqoop jobs and Ranger policies; usage logs reveal what can be retired.
    - Spark jobs usually migrate with moderate change; Hive QL and Impala SQL need dialect conversion, MapReduce/Pig needs rewrite.
    - Move HDFS data to object storage and convert to Delta or Iceberg; decouple storage from compute.
    - Replace Oozie with Databricks Workflows, Airflow or Cloud Composer; map Ranger policies to Unity Catalog or cloud-native governance.
  known_challenges:
    - Long-lived clusters accumulate undocumented jobs, UDFs and shell-script glue.
    - Hive/Impala UDFs and SerDes may not be available on the target.
    - End of support for CDH/HDP versions creates time pressure for migration.
  risks: [hidden-business-logic, data-volume-transfer, scheduling-dependency-loss, lineage-loss, sql-dialect-conversion, skills-gap]
  strategies: [retire, rehost, replatform, refactor, rearchitect]
  skills: [Hadoop, Hive, Spark, Oozie, Ranger]
  tags: [hadoop, legacy, on-prem, data-lake]
  docs:
    - title: Cloudera documentation
      url: https://docs.cloudera.com/
