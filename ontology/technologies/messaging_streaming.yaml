  operational_model: managed
  icon: activity
  color: "#FF9900"
  description: Amazon Managed Streaming for Apache Kafka, a managed Kafka service (provisioned or serverless) with MSK Connect for managed Kafka Connect workers.
  typical_legacy_use: AWS-native landing point for workloads moving off self-managed Kafka while keeping the open-source Kafka APIs.
  capabilities: [event-streaming, managed-kafka, msk-connect, iam-auth, tiered-storage]
  possible_targets: []
  alternatives: [confluent-cloud, amazon-kinesis, azure-event-hubs, google-pubsub]
  replaces: [apache-kafka, ibm-mq, activemq, rabbitmq]
  suggested_next: [databricks-auto-loader, spark-structured-streaming, apache-flink, amazon-s3, delta-bronze]
  migration_considerations:
    - MirrorMaker 2 on MSK Connect is the usual replication path from on-prem Kafka.
    - Decide between provisioned and MSK Serverless based on partition counts, throughput and feature needs.
    - Plan IAM access control versus SASL/SCRAM or mTLS for client authentication.
  known_challenges:
    - Broker sizing and partition limits per broker still require capacity planning on provisioned clusters.
    - Cross-account and cross-VPC client connectivity needs multi-VPC private connectivity design.
