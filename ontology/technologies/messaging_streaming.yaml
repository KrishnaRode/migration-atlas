- id: google-pubsub
  name: Google Cloud Pub/Sub
  aliases: [pubsub, pub/sub, pub sub, cloud pubsub, google pub/sub]
  vendor: Google Cloud
  category: streaming
  role: streaming
  layer: ingestion
  environment: cloud
  legacy: false
  clouds: [gcp]
  stage: null
  platforms: []
  operational_model: serverless
  icon: radio
  color: "#4285F4"
  description: Serverless, globally available messaging and event-ingestion service with at-least-once (optionally exactly-once) delivery, push/pull subscriptions and direct BigQuery and Cloud Storage subscriptions.
  typical_legacy_use: Event ingestion backbone on Google Cloud for application events, IoT telemetry and CDC streams feeding Dataflow, BigQuery and Cloud Storage.
  capabilities: [event-streaming, publish-subscribe, serverless-messaging, bigquery-subscription, message-ordering, dead-letter-topics]
  possible_targets: []
  alternatives: [apache-kafka, confluent-cloud, azure-event-hubs, amazon-kinesis]
  replaces: [ibm-mq, activemq, rabbitmq, apache-kafka]
  suggested_next: [google-dataflow, bigquery, google-cloud-storage, databricks-auto-loader, spark-structured-streaming]
  migration_considerations:
    - Pub/Sub is not Kafka-protocol compatible; producers and consumers must be rewritten or bridged with the Pub/Sub Kafka connector.
    - Ordering is per ordering key, not per partition; redesign partition-based ordering assumptions.
    - Retention and replay (seek to timestamp/snapshot) differ from Kafka offsets; validate replay requirements.
    - BigQuery subscriptions can remove a Dataflow hop for simple append-only ingestion.
  known_challenges:
    - At-least-once delivery requires idempotent downstream processing unless exactly-once subscriptions are enabled.
    - Message size limit (10 MB) and attribute limits constrain large-payload use cases.
  risks: [integration-breakage, vendor-lock-in, schema-drift, skills-gap]
  strategies: [replatform, rearchitect]
  skills: [Pub/Sub, Dataflow / Apache Beam, Event-driven architecture]
  tags: [streaming, messaging, serverless, gcp]
  docs:
    - title: Pub/Sub documentation
      url: https://cloud.google.com/pubsub/docs

- id: azure-event-hubs
  name: Azure Event Hubs
  aliases: [event hubs, event hub, eventhubs, azure event hub]
  vendor: Microsoft
  category: streaming
  role: streaming
  layer: ingestion
  environment: cloud
  legacy: false
  clouds: [azure]
  stage: null
  platforms: []
  operational_model: managed
  icon: activity
  color: "#0078D4"
  description: Fully managed, partitioned event-ingestion service on Azure with a native Apache Kafka-compatible endpoint, Capture to ADLS and Schema Registry.
  typical_legacy_use: Telemetry, clickstream and application-event ingestion on Azure, commonly feeding Stream Analytics, Databricks and Fabric.
  capabilities: [event-streaming, kafka-protocol-endpoint, event-capture, schema-registry, partitioned-log]
  possible_targets: []
  alternatives: [apache-kafka, confluent-cloud, google-pubsub, amazon-kinesis]
  replaces: [ibm-mq, activemq, rabbitmq, apache-kafka]
  suggested_next: [azure-stream-analytics, databricks-auto-loader, spark-structured-streaming, adls-gen2, microsoft-fabric]
  migration_considerations:
    - The Kafka endpoint lets many Kafka clients connect with configuration changes only, but not every Kafka feature (e.g. some admin APIs, transactions on lower tiers) is supported.
    - Size throughput/processing units by tier (Standard, Premium, Dedicated); partition count is fixed on lower tiers.
    - Event Hubs Capture provides a low-effort raw landing of events into ADLS Gen2 in Avro or Parquet.
  known_challenges:
    - Retention limits vary by tier and are shorter than typical self-managed Kafka retention.
    - Consumer-group limits per tier constrain fan-out designs.
  risks: [integration-breakage, vendor-lock-in, cost-overrun]
  strategies: [replatform, rearchitect]
  skills: [Azure Event Hubs, Kafka, Azure networking]
  tags: [streaming, kafka-compatible, managed, azure]
  docs:
    - title: Azure Event Hubs documentation
      url: https://learn.microsoft.com/azure/event-hubs/

- id: amazon-kinesis
  name: Amazon Kinesis Data Streams
  aliases: [kinesis, amazon kinesis, kinesis data streams, kds]
  vendor: Amazon Web Services
  category: streaming
  role: streaming
  layer: ingestion
  environment: cloud
  legacy: false
  clouds: [aws]
  stage: null
  platforms: []
  operational_model: serverless
  icon: waves
  color: "#8C4FFF"
  description: Serverless, shard-based real-time data-streaming service on AWS with on-demand or provisioned capacity and native integration with Firehose, Lambda and Managed Service for Apache Flink.
  typical_legacy_use: AWS-native ingestion of clickstream, IoT and log data, often paired with Kinesis Data Firehose to land data in S3 or Redshift.
  capabilities: [event-streaming, serverless-streaming, shard-based-scaling, firehose-delivery, enhanced-fan-out]
  possible_targets: [amazon-msk, confluent-cloud]
  alternatives: [amazon-msk, apache-kafka, google-pubsub, azure-event-hubs]
  replaces: [rabbitmq, activemq]
  suggested_next: [apache-flink, spark-structured-streaming, databricks-auto-loader, amazon-s3, amazon-redshift]
  migration_considerations:
    - Kinesis is not Kafka-compatible; migrating Kafka producers requires SDK or KPL changes.
    - Choose on-demand versus provisioned mode based on traffic predictability and cost.
    - Retention defaults to 24 hours (extendable to 365 days); confirm replay windows.
  known_challenges:
    - Per-shard throughput limits require careful partition-key design to avoid hot shards.
    - Ordering is only guaranteed within a shard.
  risks: [vendor-lock-in, cost-overrun, integration-breakage]
  strategies: [replatform, rearchitect]
  skills: [Amazon Kinesis, AWS Lambda, Apache Flink]
  tags: [streaming, serverless, aws, real-time]
  docs:
    - title: Amazon Kinesis Data Streams documentation
      url: https://docs.aws.amazon.com/kinesis/
