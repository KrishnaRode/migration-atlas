# Messaging and event-streaming backbones (legacy brokers and modern streaming platforms).
- id: ibm-mq
  name: IBM MQ
  aliases: [ibm mq, websphere mq, mqseries, mq series]
  vendor: IBM
  category: messaging
  role: streaming
  layer: ingestion
  environment: on-prem
  legacy: true
  clouds: [on-prem]
  stage: null
  platforms: []
  operational_model: self-managed
  icon: mail
  color: "#1F70C1"
  description: Enterprise message-oriented middleware providing assured, once-only delivery of messages over point-to-point queues and publish/subscribe topics.
  typical_legacy_use: Backbone for transactional integration between mainframe (CICS/IMS), ERP and distributed Java applications, typically carrying payments, orders and reference-data updates with XA transactional guarantees.
  capabilities: [message-queuing, publish-subscribe, assured-delivery, transactional-messaging, mainframe-integration]
  possible_targets: [apache-kafka, confluent-cloud, amazon-msk, google-pubsub, azure-event-hubs]
  alternatives: [rabbitmq, activemq]
  replaces: []
  suggested_next: [apache-kafka, confluent-cloud, google-pubsub, azure-event-hubs, amazon-msk]
  migration_considerations:
    - Inventory queue managers, queues, channels, clusters and the applications bound to each before choosing a target pattern.
    - Queue semantics (destructive consume, per-message acknowledgement, priority, message expiry) do not map one-to-one onto log-based platforms such as Kafka or Pub/Sub.
    - XA / two-phase-commit consumers must be redesigned around idempotent processing or transactional outbox patterns.
    - A Kafka Connect IBM MQ source/sink connector or MQ-to-Kafka bridge allows a phased coexistence period instead of a big-bang cutover.
  known_challenges:
    - Mainframe producers using MQ over CICS or IMS often cannot be changed, so a bridge must remain in place for years.
    - Message formats are frequently EBCDIC copybook payloads that require conversion downstream.
    - Strict ordering and exactly-once business expectations are often implicit and undocumented.
  risks: [integration-breakage, mainframe-encoding, hidden-business-logic, cutover-downtime, skills-gap]
  strategies: [retain, rehost, replatform, rearchitect]
  skills: [IBM MQ administration, JMS, Kafka Connect, Event-driven architecture]
  tags: [messaging, queue, legacy, mainframe, jms]
  docs:
    - title: IBM MQ documentation
      url: https://www.ibm.com/docs/en/ibm-mq

- id: rabbitmq
  name: RabbitMQ
  aliases: [rabbitmq, rabbit mq, amqp broker]
  vendor: Broadcom (VMware)
  category: messaging
  role: streaming
  layer: ingestion
  environment: any
  legacy: false
  clouds: [on-prem, aws, azure, gcp]
  stage: null
  platforms: []
  operational_model: self-managed
  icon: mail
  color: "#FF6600"
  description: Open-source message broker implementing AMQP 0-9-1 (plus MQTT and STOMP) with flexible exchange-based routing, quorum queues and streams.
  typical_legacy_use: Task queues and asynchronous service-to-service messaging for microservices and web applications; occasionally used as a lightweight event bus feeding downstream data pipelines.
  capabilities: [message-queuing, publish-subscribe, flexible-routing, amqp, mqtt]
  possible_targets: [apache-kafka, confluent-cloud, amazon-msk, google-pubsub, azure-event-hubs, amazon-kinesis]
  alternatives: [activemq, ibm-mq, google-pubsub]
  replaces: []
  suggested_next: [apache-kafka, google-pubsub, azure-event-hubs, amazon-kinesis]
  migration_considerations:
    - RabbitMQ queues are transient work queues; analytics use cases usually need a replayable log (Kafka, Pub/Sub, Event Hubs, Kinesis) instead.
    - Exchange/binding topologies (topic, headers, fanout) must be translated into topics, subscriptions or filters on the target.
    - Consumers relying on per-message acks, dead-lettering and TTL need equivalent dead-letter and retry policies on the target.
  known_challenges:
    - Routing logic embedded in exchange bindings is easy to overlook during inventory.
    - Throughput and retention characteristics change significantly when moving to a log-based platform.
  risks: [integration-breakage, hidden-business-logic, operational-readiness]
  strategies: [retain, rehost, replatform, rearchitect]
  skills: [AMQP, RabbitMQ administration, Event-driven architecture]
  tags: [messaging, queue, amqp, open-source]
  docs:
    - title: RabbitMQ documentation
      url: https://www.rabbitmq.com/docs

- id: activemq
  name: Apache ActiveMQ
  aliases: [activemq, active mq, activemq artemis, amazon mq]
  vendor: Apache Software Foundation
  category: messaging
  role: streaming
  layer: ingestion
  environment: on-prem
  legacy: true
  clouds: [on-prem]
  stage: null
  platforms: []
  operational_model: self-managed
  icon: mail
  color: "#C2185B"
  description: Open-source JMS message broker (Classic and Artemis) supporting OpenWire, AMQP, STOMP and MQTT for queue and topic messaging.
  typical_legacy_use: JMS backbone for Java EE application servers (WebLogic, WebSphere, JBoss) and ESB integrations, carrying order, event and notification messages between applications.
  capabilities: [message-queuing, publish-subscribe, jms, multi-protocol-messaging]
  possible_targets: [apache-kafka, confluent-cloud, amazon-msk, google-pubsub, azure-event-hubs]
  alternatives: [ibm-mq, rabbitmq]
  replaces: []
  suggested_next: [apache-kafka, amazon-msk, google-pubsub, azure-event-hubs]
  migration_considerations:
    - Amazon MQ offers a lift-and-shift (rehost) path that preserves JMS semantics with minimal application change.
    - Data-analytics consumers should be repointed to a replayable streaming log rather than JMS topics.
    - Durable subscriptions, message selectors and XA transactions must be inventoried per application.
  known_challenges:
    - Message selectors and JMS-specific headers have no direct equivalent in Kafka or Pub/Sub.
    - Network-of-brokers topologies hide cross-site routing behaviour.
  risks: [integration-breakage, hidden-business-logic, cutover-downtime]
  strategies: [retain, rehost, replatform, rearchitect, retire]
  skills: [JMS, ActiveMQ administration, Java EE integration]
  tags: [messaging, queue, jms, legacy, open-source]
  docs:
    - title: Apache ActiveMQ documentation
      url: https://activemq.apache.org/components/classic/documentation

- id: apache-kafka
  name: Apache Kafka
  aliases: [kafka, apache kafka, kafka cluster]
  vendor: Apache Software Foundation
  category: streaming
  role: streaming
  layer: ingestion
  environment: any
  legacy: false
  clouds: [on-prem, aws, azure, gcp]
  stage: null
  platforms: []
  operational_model: self-managed
  icon: activity
  color: "#231F20"
  description: Distributed, partitioned and replicated commit log used as a high-throughput event-streaming platform with durable retention and consumer-group replay.
  typical_legacy_use: Self-managed clusters (often on-prem or on VMs) acting as the central event bus for CDC feeds, application events, logs and clickstream, with Kafka Connect for integration and Kafka Streams/ksqlDB for processing.
  capabilities: [event-streaming, publish-subscribe, durable-log, replay, kafka-connect, exactly-once-semantics]
  possible_targets: [confluent-cloud, amazon-msk, azure-event-hubs, google-pubsub]
  alternatives: [google-pubsub, azure-event-hubs, amazon-kinesis, confluent-cloud]
  replaces: [ibm-mq, activemq, rabbitmq]
  suggested_next: [spark-structured-streaming, databricks-auto-loader, apache-flink, delta-bronze, google-dataflow]
  migration_considerations:
    - Managed Kafka (Confluent Cloud, Amazon MSK, Event Hubs Kafka endpoint) preserves the Kafka protocol so producers and consumers usually only need connection and auth changes.
    - Topic replication with MirrorMaker 2 or Cluster Linking enables a phased consumer-first cutover while offsets are translated.
    - Review partition counts, retention, compaction and ACLs; managed services impose quotas and different defaults.
    - Schema Registry subjects and compatibility settings must be migrated alongside topics.
  known_challenges:
    - Offset translation between clusters is error-prone and can cause duplicate or skipped processing.
    - Self-managed Connect workers and custom SMTs often carry undocumented logic.
    - Operating ZooKeeper-based clusters and upgrading to KRaft adds operational complexity.
  risks: [cdc-lag, schema-drift, operational-readiness, integration-breakage, skills-gap]
  strategies: [retain, rehost, replatform, repurchase]
  skills: [Kafka administration, Kafka Connect, Schema Registry, Event-driven architecture]
  tags: [streaming, kafka, event-bus, open-source, real-time]
  docs:
    - title: Apache Kafka documentation
      url: https://kafka.apache.org/documentation/

- id: confluent-cloud
  name: Confluent Cloud
  aliases: [confluent, confluent cloud, confluent kafka]
  vendor: Confluent
  category: streaming
  role: streaming
  layer: ingestion
  environment: saas
  legacy: false
  clouds: [aws, azure, gcp]
  stage: null
  platforms: []
  operational_model: saas
  icon: activity
  color: "#0074A2"
  description: Fully managed, cloud-native Kafka service with managed connectors, Schema Registry, stream governance, Flink SQL and Tableflow for Iceberg/Delta materialisation.
  typical_legacy_use: Target for organisations exiting self-managed Kafka that want a multi-cloud managed event-streaming platform with fully managed connectors.
  capabilities: [event-streaming, managed-kafka, managed-connectors, schema-registry, stream-processing, cluster-linking]
  possible_targets: []
  alternatives: [amazon-msk, azure-event-hubs, google-pubsub, amazon-kinesis]
  replaces: [apache-kafka, ibm-mq, activemq, rabbitmq]
  suggested_next: [databricks-auto-loader, spark-structured-streaming, apache-flink, delta-bronze, snowpipe]
  migration_considerations:
    - Cluster Linking replicates topics with preserved offsets from self-managed Kafka, simplifying consumer cutover.
    - Choose cluster type (Basic, Standard, Enterprise, Dedicated) based on throughput, private networking and SLA requirements.
    - Private connectivity (PrivateLink / Private Service Connect / peering) must be designed up-front for regulated workloads.
  known_challenges:
    - Consumption-based pricing (eCKUs, throughput, connector tasks) can surprise teams used to fixed on-prem cost.
    - Not every self-managed Connect plugin is available as a fully managed connector.
  risks: [cost-overrun, vendor-lock-in, network-bandwidth, security-gap]
  strategies: [repurchase, replatform]
  skills: [Kafka, Confluent Cloud, Schema Registry, Flink SQL]
  tags: [streaming, kafka, managed, saas, multi-cloud]
  docs:
    - title: Confluent Cloud documentation
      url: https://docs.confluent.io/cloud/current/overview.html

- id: amazon-msk
  name: Amazon MSK
  aliases: [msk, amazon msk, managed streaming for kafka, aws msk]
