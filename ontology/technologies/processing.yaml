- id: databricks-sql
  name: Databricks SQL
  aliases: [databricks sql, dbsql, sql warehouse, databricks sql warehouse]
  vendor: Databricks
  category: data-warehouse
  role: serving
  layer: serving
  environment: cloud
  legacy: false
  clouds: [aws, azure, gcp]
  stage: null
  platforms: [databricks]
  operational_model: serverless
  icon: database
  color: "#FF3621"
  description: Serverless SQL warehouses on the Databricks lakehouse powered by the Photon engine, serving BI, ad hoc SQL, dashboards and metric views over Unity Catalog tables.
  typical_legacy_use: Replaces EDW appliance query serving (Teradata, Netezza, Exadata) for BI tools and analysts after migration to Databricks.
  capabilities: [sql-warehousing, serverless-compute, photon-engine, bi-connectivity, ai-bi-dashboards, metric-views, query-federation]
  possible_targets: []
  alternatives: [snowflake, bigquery, amazon-redshift, azure-synapse]
  replaces: [teradata, netezza, oracle-exadata, greenplum]
  suggested_next: [power-bi, tableau, looker, unity-catalog, amazon-quicksight]
  migration_considerations:
    - Size serverless SQL warehouses and scaling ranges per workload class (BI, ad hoc, ETL SQL).
    - Convert legacy SQL dialects (BTEQ, PL/SQL, T-SQL) to Databricks SQL, including SQL scripting for procedural logic.
    - Tune gold tables with liquid clustering and predictive optimisation for BI concurrency.
    - Repoint BI connections (ODBC/JDBC, Partner Connect) and validate report parity.
  known_challenges:
    - High-concurrency BI workloads need warehouse sizing and query-result caching strategy.
    - Legacy workload-management rules have no one-to-one equivalent.
  risks: [sql-dialect-conversion, performance-regression, report-parity, cost-overrun]
  strategies: [replatform, refactor]
  skills: [Databricks SQL, SQL, BI integration]
  tags: [serving, sql, databricks, warehouse, serverless]
  docs:
    - title: Databricks SQL documentation
      url: https://docs.databricks.com/aws/en/sql/
