- id: google-dvt
  name: Google Data Validation Tool
  aliases: [dvt, data validation tool, google dvt, professional services data validator]
  vendor: Google Cloud
  category: data-quality
  role: data-quality
  layer: governance
  environment: any
  legacy: false
  clouds: [gcp, on-prem, aws, azure]
  stage: null
  platforms: []
  operational_model: self-managed
  icon: check-check
  color: "#34A853"
  description: Google's open-source Python CLI for validating data between heterogeneous sources and targets using column aggregates, row-level hashes, schema and custom-query comparisons.
  typical_legacy_use: Used in migrations to BigQuery, Cloud SQL, AlloyDB and Spanner to compare Teradata, Oracle, SQL Server, Hive and other sources against targets during parallel run.
  capabilities: [reconciliation, data-validation, parallel-run-support, data-quality-checks, schema-validation, row-hash-comparison]
  possible_targets: []
  alternatives: [reconciliation-framework, great-expectations]
  replaces: []
  suggested_next: [bigquery, cloud-composer, google-dataplex, google-cloud-storage]
  migration_considerations:
    - Start with column-level aggregate validations, then add row-hash validations on primary keys for critical tables.
    - Store validation results in BigQuery to build a cutover evidence dashboard.
    - Run validations at scale by partitioning tables and orchestrating via Cloud Composer or Cloud Run jobs.
  known_challenges:
    - Row-level validation requires a reliable primary or composite key on both sides.
    - Data type and collation differences need explicit casting or calculated fields to avoid false mismatches.
  risks: [data-quality-regression, data-type-mismatch, parallel-run-cost]
  strategies: [replatform, refactor]
