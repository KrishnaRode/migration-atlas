- id: reconciliation-framework
  name: Reconciliation Framework
  aliases: [reconciliation framework, data reconciliation, recon framework, source to target reconciliation]
  vendor: Generic
  category: data-quality
  role: data-quality
  layer: governance
  environment: any
  legacy: false
  clouds: [any]
  stage: null
  platforms: []
  operational_model: self-managed
  icon: check-check
  color: "#84CC16"
  description: Generic source-to-target reconciliation component that compares row counts, column checksums, aggregates and sampled records between legacy and target systems during parallel run and cutover.
  typical_legacy_use: Built as a migration accelerator that runs after each load cycle in parallel run, producing pass/fail evidence that business owners use to sign off cutover.
  capabilities: [reconciliation, data-validation, parallel-run-support, data-quality-checks, row-count-comparison, checksum-comparison, aggregate-comparison, sampling]
  possible_targets: []
  alternatives: [google-dvt, great-expectations]
  replaces: []
  suggested_next: [databricks-workflows, apache-airflow, lakehouse-monitoring, google-dvt, great-expectations]
  migration_considerations:
    - Define reconciliation tiers up front (counts, column checksums, aggregates by business key, record-level sampling) and tolerances per table.
    - Normalise data types, time zones, character encodings and numeric precision before hashing or comparison.
    - Schedule reconciliation after every parallel-run cycle and persist results as auditable evidence for cutover sign-off.
    - Handle in-flight CDC by comparing at consistent watermarks or snapshot timestamps.
  known_challenges:
    - Full record-level comparison on very large tables is expensive; stratified sampling and partition-level hashing are needed.
    - Type and precision differences between platforms create false mismatches unless normalised.
    - Business owners must agree acceptable tolerances, which is often slower than building the tooling.
  risks: [data-quality-regression, parallel-run-cost, data-type-mismatch, cutover-downtime]
  strategies: [refactor, rearchitect, replatform]
  skills: [SQL, Python, Data testing, Data modelling]
  tags: [data-quality, reconciliation, parallel-run, cutover, validation]
  docs: []

