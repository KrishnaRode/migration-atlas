- id: aws-lake-formation
  name: AWS Lake Formation
  aliases: [lake formation, aws lake formation]
  vendor: Amazon Web Services
  category: governance
  role: governance
  layer: governance
  environment: cloud
  legacy: false
  clouds: [aws]
  stage: null
  platforms: []
  operational_model: managed
  icon: shield-check
  color: "#FF9900"
  description: AWS service that centralises fine-grained permissions, tag-based access control and cross-account sharing for data lakes catalogued in the AWS Glue Data Catalog.
  typical_legacy_use: Used to govern S3-based data lakes queried by Athena, Redshift Spectrum, EMR and Glue, replacing bucket-policy and IAM-only access models.
  capabilities: [access-control, catalog, data-discovery, row-column-security, tag-based-access-control, data-sharing, auditing]
  possible_targets: []
  alternatives: [unity-catalog, google-dataplex, microsoft-purview]
  replaces: []
  suggested_next: [aws-glue-data-catalog, amazon-s3, aws-iam, amazon-redshift, aws-kms]
  migration_considerations:
    - Switch from IAM-only access to Lake Formation permissions deliberately; the IAMAllowedPrincipals default must be revoked per database.
    - Use LF-Tags for scalable tag-based access control rather than per-table grants.
    - Register S3 locations with an appropriate role and plan cross-account sharing via AWS RAM.
  known_challenges:
    - Mixed IAM and Lake Formation permission models cause confusing access-denied errors during transition.
    - Not all query engines and third-party tools honour Lake Formation fine-grained permissions.
  risks: [governance-gap, security-gap, integration-breakage]
  strategies: [replatform, refactor]
  skills: [AWS IAM, AWS Lake Formation, AWS Glue]
  tags: [governance, access-control, aws, data-lake]
  docs:
    - title: AWS Lake Formation documentation
      url: https://docs.aws.amazon.com/lake-formation/

- id: aws-glue-data-catalog
  name: AWS Glue Data Catalog
  aliases: [glue catalog, glue data catalog]
  vendor: Amazon Web Services
  category: governance
  role: governance
  layer: governance
  environment: cloud
  legacy: false
  clouds: [aws]
  stage: null
  platforms: []
  operational_model: serverless
  icon: book-open
  color: "#FF9900"
  description: Hive-metastore-compatible central metadata repository on AWS that stores table definitions, schemas and partitions used by Athena, EMR, Glue and Redshift Spectrum.
  typical_legacy_use: Serves as the shared metastore for S3 data lakes, populated by Glue crawlers or ETL jobs, often replacing self-managed Hive metastores from Hadoop clusters.
  capabilities: [catalog, metastore, schema-registry, data-discovery, schema-inference]
  possible_targets: [unity-catalog, aws-lake-formation]
  alternatives: [unity-catalog, google-dataplex]
  replaces: []
  suggested_next: [aws-lake-formation, aws-glue, amazon-s3, amazon-redshift]
  migration_considerations:
    - Migrate Hive metastore definitions via Glue import scripts or crawlers; validate partition metadata after load.
    - Decide whether crawlers or explicit DDL own schema evolution to avoid schema drift.
    - Pair with Lake Formation for fine-grained access control rather than relying on IAM resource policies.
  known_challenges:
    - Crawlers can infer incorrect types or split tables when file layouts are inconsistent.
    - Large partition counts degrade query planning without partition indexes or projection.
  risks: [schema-drift, governance-gap, data-type-mismatch]
  strategies: [replatform, retain]
  skills: [AWS Glue, Hive metastore, SQL]
  tags: [catalog, metastore, aws]
  docs:
    - title: AWS Glue Data Catalog
      url: https://docs.aws.amazon.com/glue/latest/dg/catalog-and-crawler.html

