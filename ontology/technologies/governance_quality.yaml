# Governance (catalog, lineage, access policy) and data-quality / reconciliation technologies.

- id: unity-catalog
  name: Unity Catalog
  aliases: [uc, unity catalog, databricks unity catalog]
  vendor: Databricks
  category: governance
  role: governance
  layer: governance
  environment: cloud
  legacy: false
  clouds: [aws, azure, gcp]
  stage: null
  platforms: [databricks]
  operational_model: managed
  icon: shield-check
  color: "#FF3621"
  description: Unified governance layer for data and AI assets on Databricks, providing a three-level namespace, fine-grained access control, lineage, auditing and discovery.
  typical_legacy_use: Replaces the per-workspace Hive metastore and table ACLs, centralising permissions, lineage and audit across all Databricks workspaces in a region.
  capabilities: [catalog, lineage, access-control, data-discovery, auditing, row-column-security, data-sharing, metastore]
  possible_targets: []
  alternatives: [google-dataplex, microsoft-purview, aws-lake-formation, snowflake-horizon, collibra]
  replaces: [aws-glue-data-catalog]
  suggested_next: [lakehouse-monitoring, databricks-sql, reconciliation-framework, microsoft-entra-id, databricks-asset-bundles]
  migration_considerations:
    - Plan the catalog / schema hierarchy (by environment, domain or business unit) before migrating any tables.
    - Upgrade Hive metastore tables with SYNC or deep clone; external tables need storage credentials and external locations.
    - Map legacy table ACLs and IAM-based access to account-level groups synced from the identity provider via SCIM.
    - Clusters must use Unity Catalog-capable access modes; legacy init scripts and instance-profile patterns may need rework.
  known_challenges:
    - Workloads relying on DBFS mounts or direct cloud-storage paths must be refactored to volumes and external locations.
    - Row filters and column masks need re-implementation from legacy view-based security models.
    - Lineage only covers workloads that run through Unity Catalog-enabled compute.
  risks: [governance-gap, lineage-loss, security-gap, skills-gap]
  strategies: [replatform, refactor]
  skills: [Databricks administration, Unity Catalog, SQL, Identity and access management]
  tags: [governance, catalog, lineage, databricks, lakehouse]
  docs:
    - title: What is Unity Catalog?
      url: https://docs.databricks.com/en/data-governance/unity-catalog/index.html

- id: google-dataplex
  name: Google Cloud Dataplex
  aliases: [dataplex, dataplex universal catalog, google dataplex]
  vendor: Google Cloud
  category: governance
  role: governance
  layer: governance
  environment: cloud
  legacy: false
  clouds: [gcp]
  stage: null
  platforms: []
  operational_model: managed
  icon: shield-check
  color: "#4285F4"
  description: Google Cloud's intelligent data fabric for discovering, cataloguing, governing and quality-checking data across Cloud Storage, BigQuery and other sources.
  typical_legacy_use: Used as the central metadata catalog (successor to Data Catalog), lineage tracker and data-quality engine for GCP analytics estates organised into lakes and zones.
  capabilities: [catalog, lineage, access-control, data-discovery, data-profiling, data-quality-checks, metadata-management]
  possible_targets: []
  alternatives: [unity-catalog, microsoft-purview, aws-lake-formation, collibra, alation]
  replaces: []
  suggested_next: [bigquery, google-cloud-storage, google-iam, google-dvt, vpc-service-controls]
  migration_considerations:
    - Design lakes, zones and assets to mirror data domains before attaching Cloud Storage buckets and BigQuery datasets.
    - Define aspect types and business glossary terms early so migrated assets are tagged consistently.
    - Enable automatic data lineage for BigQuery and Dataflow; lineage from external tools requires the Lineage API.
    - Use auto data quality scans to establish baselines before and after cutover.
  known_challenges:
    - Lineage coverage is limited to supported GCP services; lineage from legacy ETL tools is not captured automatically.
    - Migrating custom metadata and tags from legacy catalogs needs scripted import.
  risks: [governance-gap, lineage-loss, vendor-lock-in]
  strategies: [replatform, repurchase]
  skills: [Google Cloud data governance, BigQuery, IAM]
  tags: [governance, catalog, lineage, gcp]
  docs:
    - title: Dataplex documentation
      url: https://cloud.google.com/dataplex/docs

