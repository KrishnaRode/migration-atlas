- id: lakehouse-monitoring
  name: Databricks Lakehouse Monitoring
  aliases: [lakehouse monitoring, databricks data quality monitoring]
  vendor: Databricks
  category: data-quality
  role: data-quality
  layer: governance
  environment: cloud
  legacy: false
  clouds: [aws, azure, gcp]
  stage: null
  platforms: [databricks]
  operational_model: serverless
  icon: scan-search
  color: "#FF3621"
  description: Databricks feature that profiles Unity Catalog tables and model inference logs over time, computing statistical metrics, drift and custom quality checks with generated dashboards.
  typical_legacy_use: Attached to gold and serving tables to detect data drift, null spikes and freshness issues after migrated pipelines go live.
  capabilities: [data-quality-checks, data-profiling, drift-detection, metrics, alerting, data-validation]
  possible_targets: []
  alternatives: [great-expectations, google-dataplex]
  replaces: []
  suggested_next: [unity-catalog, databricks-sql, databricks-workflows, reconciliation-framework]
  migration_considerations:
    - Create monitors on critical gold tables with baseline tables captured from the legacy system where possible.
    - Choose snapshot, time-series or inference profiles to match each table's access pattern.
    - Route SQL alerts on metric tables to on-call channels as part of operational readiness.
  known_challenges:
    - Requires Unity Catalog-managed tables and serverless compute, adding cost per monitored table.
    - Profiling is statistical; it does not replace source-to-target reconciliation during cutover.
  risks: [data-quality-regression, cost-overrun]
  strategies: [replatform, refactor]
  skills: [Databricks, SQL, Data quality engineering]
  tags: [data-quality, monitoring, databricks]
  docs:
    - title: Introduction to Databricks Lakehouse Monitoring
      url: https://docs.databricks.com/en/lakehouse-monitoring/index.html
