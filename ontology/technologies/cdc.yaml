- id: snowpipe
  name: Snowpipe
  aliases: [snowpipe, snowpipe streaming]
  vendor: Snowflake
  category: cdc
  role: cdc
  layer: ingestion
  environment: cloud
  legacy: false
  clouds: [aws, azure, gcp]
  stage: null
  platforms: [snowflake]
  operational_model: serverless
  icon: refresh-cw
  color: "#29B5E8"
  description: Snowflake's serverless continuous loading service that ingests files from stages as they arrive (and, via Snowpipe Streaming, rows through an SDK/Kafka connector).
  typical_legacy_use: Replaces scheduled bulk COPY jobs with event-driven, near-real-time file loading into Snowflake.
  capabilities: [continuous-file-ingestion, event-notifications, serverless, streaming-ingestion]
  possible_targets: []
  alternatives: [databricks-auto-loader]
  replaces: []
  suggested_next: [snowflake, dbt, snowflake-horizon]
  migration_considerations:
    - Configure cloud event notifications (S3/SQS, GCS Pub/Sub, Azure Event Grid) or REST calls to trigger loads.
    - Optimal file sizes (roughly 100-250 MB compressed) reduce per-file overhead and cost.
    - Snowpipe does not provide CDC from databases on its own; pair it with an upstream CDC tool writing files or Kafka.
  known_challenges:
    - Load ordering is not guaranteed; downstream logic must handle late or out-of-order files.
    - Many tiny files increase cost.
  risks: [cost-overrun, data-quality-regression, vendor-lock-in]
  strategies: [replatform]
  skills: [Snowflake, cloud storage eventing]
  tags: [ingestion, snowflake, serverless]
  docs:
    - title: Snowpipe introduction
      url: https://docs.snowflake.com/en/user-guide/data-load-snowpipe-intro

- id: databricks-auto-loader
  name: Databricks Auto Loader
  aliases: [auto loader, autoloader, cloudfiles, databricks auto loader]
  vendor: Databricks
  category: cdc
  role: cdc
  layer: ingestion
  environment: cloud
  legacy: false
  clouds: [aws, azure, gcp]
  stage: null
  platforms: [databricks]
  operational_model: managed
  icon: refresh-cw
  color: "#FF3621"
  description: Databricks' Structured Streaming source (cloudFiles) that incrementally and idempotently ingests new files from cloud object storage, with schema inference and evolution.
  typical_legacy_use: Picks up files landed by CDC tools, partner feeds or exports in a landing zone and loads them into bronze Delta tables.
  capabilities: [incremental-file-ingestion, schema-inference, schema-evolution, exactly-once, file-notification-mode]
  possible_targets: []
  alternatives: [snowpipe]
  replaces: []
  suggested_next: [delta-bronze, lakeflow-declarative-pipelines, unity-catalog, databricks-workflows]
  migration_considerations:
    - Choose directory listing or file notification mode based on file volume and cloud permissions.
    - Define rescued-data and schema evolution behaviour so malformed or new columns are not silently lost.
    - Use it inside Lakeflow Declarative Pipelines or jobs with checkpoints on durable storage.
  known_challenges:
    - Auto Loader ingests files; it does not capture database changes itself and depends on an upstream CDC or export process.
    - Checkpoint loss forces reprocessing decisions.
  risks: [schema-drift, data-quality-regression]
  strategies: [replatform, rearchitect]
  skills: [Databricks, Spark Structured Streaming]
  tags: [ingestion, databricks, files]
  docs:
    - title: What is Auto Loader?
      url: https://docs.databricks.com/aws/en/ingestion/cloud-object-storage/auto-loader/
