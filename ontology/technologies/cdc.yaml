  color: "#00A7E1"
  description: Real-time data integration platform combining log-based CDC with in-flight streaming SQL transformations, available self-managed or as Striim Cloud.
  typical_legacy_use: Streams Oracle, SQL Server and other database changes to cloud warehouses, Kafka and object storage with low latency.
  capabilities: [log-based-cdc, stream-processing, real-time-replication, in-flight-transformation]
  possible_targets: []
