- id: google-cloud-kms
  name: Google Cloud KMS
  aliases: [cloud kms, google kms, gcp kms]
  vendor: Google Cloud
  category: security
  role: security
  layer: security
  environment: cloud
  legacy: false
  clouds: [gcp]
  stage: null
  platforms: []
  operational_model: managed
  icon: key-round
  color: "#4285F4"
  description: Google Cloud's managed key management service for creating and controlling symmetric and asymmetric keys, with Cloud HSM and Cloud External Key Manager options.
  typical_legacy_use: Provides customer-managed encryption keys (CMEK) for BigQuery, Cloud Storage, Dataflow and Dataproc to satisfy regulatory key-control requirements.
  capabilities: [key-management, encryption, cmek, hsm, auditing]
  possible_targets: []
  alternatives: [aws-kms, azure-key-vault, hashicorp-vault]
  replaces: []
  suggested_next: [google-iam, google-secret-manager, google-cloud-logging]
  migration_considerations:
    - Decide which datasets require CMEK versus Google default encryption based on compliance.
    - Create key rings in the same location as the protected resources; locations cannot be changed later.
    - Define rotation periods and separation of duties between key administrators and data users.
  known_challenges:
    - Disabling or destroying a key renders dependent data inaccessible, so key lifecycle needs strict change control.
    - Some services require CMEK to be set at resource creation, forcing re-creation of existing resources.
  risks: [security-gap, regulatory-compliance]
  strategies: [replatform, refactor]
  skills: [Google Cloud security, Key management]
  tags: [security, encryption, kms, gcp]
  docs:
    - title: Cloud Key Management Service documentation
      url: https://cloud.google.com/kms/docs

- id: aws-kms
  name: AWS KMS
  aliases: [aws kms, aws key management service]
  vendor: Amazon Web Services
  category: security
  role: security
  layer: security
  environment: cloud
  legacy: false
  clouds: [aws]
  stage: null
  platforms: []
  operational_model: managed
  icon: key-round
  color: "#DD344C"
  description: AWS managed service for creating and controlling cryptographic keys used to encrypt data across AWS services, backed by FIPS-validated HSMs.
  typical_legacy_use: Supplies customer-managed keys for S3, Redshift, EBS, RDS and Secrets Manager encryption, with key policies enforcing separation of duties.
  capabilities: [key-management, encryption, cmek, auditing, access-control]
  possible_targets: []
  alternatives: [google-cloud-kms, azure-key-vault, hashicorp-vault]
  replaces: []
  suggested_next: [aws-iam, aws-secrets-manager, amazon-s3, amazon-cloudwatch]
  migration_considerations:
    - Choose between AWS-managed and customer-managed keys per data classification.
    - Design key policies and grants for cross-account access before sharing encrypted data.
    - Consider multi-Region keys for disaster recovery of encrypted datasets.
  known_challenges:
    - High-volume encryption calls can hit request quotas; S3 Bucket Keys reduce KMS cost and throttling.
    - Misconfigured key policies can lock out administrators or break cross-account pipelines.
  risks: [security-gap, regulatory-compliance, cost-overrun]
  strategies: [replatform, refactor]
  skills: [AWS KMS, AWS IAM, Encryption]
  tags: [security, encryption, kms, aws]
  docs:
    - title: AWS Key Management Service documentation
      url: https://docs.aws.amazon.com/kms/

- id: vpc-service-controls
  name: VPC Service Controls
  aliases: [vpc service controls, vpc-sc, service perimeter]
  vendor: Google Cloud
  category: security
  role: security
  layer: security
  environment: cloud
  legacy: false
  clouds: [gcp]
  stage: null
  platforms: []
  operational_model: managed
  icon: shield
  color: "#4285F4"
  description: Google Cloud feature that defines service perimeters around projects to mitigate data exfiltration from managed services such as BigQuery and Cloud Storage.
  typical_legacy_use: Used by regulated enterprises to keep analytics data inside approved projects and networks, complementing IAM with context-aware network boundaries.
  capabilities: [network-boundary, data-exfiltration-protection, access-control, private-connectivity]
  possible_targets: []
  alternatives: [private-connectivity]
  replaces: []
  suggested_next: [google-iam, google-vpc, google-cloud-interconnect, google-cloud-logging]
  migration_considerations:
    - Start perimeters in dry-run mode and review violation logs before enforcing.
    - Define ingress and egress rules for CI/CD, BI tools and cross-project pipelines.
    - Use access levels to allow on-prem networks connected via Interconnect or VPN.
  known_challenges:
    - Enforced perimeters frequently break third-party SaaS integrations and cross-project service accounts.
    - Not every Google Cloud service is supported inside a perimeter.
  risks: [integration-breakage, security-gap, operational-readiness]
  strategies: [refactor]
  skills: [Google Cloud networking, Cloud security architecture]
  tags: [security, network, exfiltration, gcp]
  docs:
    - title: VPC Service Controls documentation
      url: https://cloud.google.com/vpc-service-controls/docs

- id: private-connectivity
  name: Private Connectivity (Private Endpoints)
  aliases: [private endpoint, private link, privatelink, private service connect]
  vendor: Generic
  category: security
  role: security
  layer: security
  environment: cloud
  legacy: false
  clouds: [aws, azure, gcp]
  stage: null
  platforms: []
  operational_model: managed
  icon: lock
  color: "#DC2626"
  description: Generic private-endpoint pattern (AWS PrivateLink, Azure Private Link, Google Private Service Connect) exposing managed services on private IPs inside a virtual network without public internet exposure.
  typical_legacy_use: Used to reach managed data platforms, storage, secret stores and SaaS endpoints privately from VPCs/VNets and on-prem networks over hybrid links.
  capabilities: [private-connectivity, network-boundary, data-exfiltration-protection, dns-integration]
  possible_targets: []
  alternatives: [vpc-service-controls]
  replaces: []
  suggested_next: [aws-vpc, azure-vnet, google-vpc, aws-direct-connect, azure-expressroute, google-cloud-interconnect]
  migration_considerations:
    - Plan private DNS zones and on-prem DNS forwarding so service hostnames resolve to private IPs.
    - Disable public network access on target services once private endpoints are validated.
    - Size IP address space for endpoints across hub-and-spoke networks.
  known_challenges:
    - DNS misconfiguration is the most common cause of connectivity failures.
    - Per-endpoint and data-processing charges add up across many services and environments.
  risks: [security-gap, integration-breakage, cost-overrun]
  strategies: [refactor, replatform]
  skills: [Cloud networking, DNS, Network security]
  tags: [security, network, private-endpoint]
