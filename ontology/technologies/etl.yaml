- id: azure-data-factory
  name: Azure Data Factory
  aliases: [adf, azure data factory, data factory]
  vendor: Microsoft
  category: etl
  role: etl
  layer: processing
  environment: cloud
  legacy: false
  clouds: [azure]
  stage: null
  platforms: []
  operational_model: serverless
  icon: workflow
  color: "#0078D4"
  description: Azure's managed data integration service for building copy pipelines, mapping data flows and orchestrating activities across cloud and on-premises sources.
  typical_legacy_use: Ingests data into ADLS, Synapse, Fabric or Databricks via self-hosted integration runtimes, and can rehost SSIS packages on the Azure-SSIS IR.
  capabilities: [batch-etl, data-ingestion, workflow-orchestration, mapping-data-flows, hybrid-connectivity, ssis-rehost]
  possible_targets: [microsoft-fabric, lakeflow-declarative-pipelines, databricks-workflows]
  alternatives: [aws-glue, google-cloud-data-fusion, informatica-idmc]
  replaces: [ssis, informatica-powercenter, ibm-datastage, talend, pentaho]
  suggested_next: [adls-gen2, databricks, azure-synapse, microsoft-fabric, azure-key-vault, azure-monitor]
  migration_considerations:
    - Self-hosted integration runtimes are needed for on-premises sources; plan HA and network paths.
    - Use ADF for movement and orchestration; push heavy transformations to Databricks, Synapse or Fabric where appropriate.
    - Parameterise linked services and deploy through ARM/Bicep or Git integration for environment promotion.
  known_challenges:
    - Complex mapping data flows can be costly and slower to debug than code-based transformations.
    - Activity limits and nested pipeline patterns complicate large orchestration graphs.
  risks: [cost-overrun, vendor-lock-in, lineage-loss]
  strategies: [replatform, refactor]
  skills: [Azure Data Factory, Azure, SQL]
  tags: [etl, cloud, azure, orchestration]
  docs:
    - title: Azure Data Factory documentation
      url: https://learn.microsoft.com/en-us/azure/data-factory/

- id: aws-glue
  name: AWS Glue
  aliases: [glue, aws glue, glue etl, glue jobs]
  vendor: Amazon Web Services
  category: etl
  role: etl
  layer: processing
  environment: cloud
  legacy: false
  clouds: [aws]
  stage: null
  platforms: []
  operational_model: serverless
  icon: workflow
  color: "#FF9900"
  description: AWS's serverless data integration service running Spark and Python shell jobs, with crawlers, workflows and integration with the Glue Data Catalog.
  typical_legacy_use: Batch ETL from S3, JDBC sources and SaaS connectors into S3 data lakes and Redshift.
  capabilities: [batch-etl, serverless-spark, data-catalog-integration, crawlers, streaming-etl]
  possible_targets: [lakeflow-declarative-pipelines, amazon-emr, dbt]
  alternatives: [azure-data-factory, google-cloud-data-fusion, informatica-idmc]
  replaces: [informatica-powercenter, ibm-datastage, talend, pentaho, ssis]
  suggested_next: [amazon-s3, aws-glue-data-catalog, amazon-redshift, aws-step-functions, amazon-mwaa, amazon-cloudwatch]
  migration_considerations:
    - Choose the Glue version (Spark runtime) and worker type deliberately; DPU consumption drives cost.
    - Use job bookmarks or explicit watermarking for incremental loads.
    - Orchestrate with Glue workflows, Step Functions or MWAA depending on complexity.
  known_challenges:
    - Cold-start latency and debugging limitations compared with long-running clusters.
    - DynamicFrame-specific code reduces portability to other Spark platforms.
  risks: [cost-overrun, vendor-lock-in, skills-gap]
  strategies: [replatform, refactor]
  skills: [PySpark, AWS Glue, AWS]
  tags: [etl, cloud, aws, serverless]
  docs:
    - title: AWS Glue documentation
      url: https://docs.aws.amazon.com/glue/

