  legacy: true
  clouds: [on-prem, aws, azure, gcp]
  stage: null
  platforms: []
  operational_model: self-managed
  icon: workflow
  color: "#FF6D70"
  description: Java code-generating data integration tool (Studio, Data Integration and Data Fabric editions), now part of Qlik.
  typical_legacy_use: Batch ETL jobs designed in Talend Studio and deployed as generated Java jobs, scheduled via the Talend Administration Center, TMC or external schedulers.
  capabilities: [batch-etl, data-transformation, java-code-generation, big-data-jobs]
  possible_targets: [lakeflow-declarative-pipelines, dbt, apache-spark, azure-data-factory, aws-glue, google-dataflow]
  alternatives: [informatica-powercenter, pentaho, ssis, ibm-datastage]
  replaces: []
  suggested_next: [lakeflow-declarative-pipelines, dbt, databricks-workflows, apache-airflow]
  migration_considerations:
    - The free Talend Open Studio was retired in 2024; confirm the licensing and support status of the installed edition.
    - Inventory tJava/tJavaRow components and routines, which carry custom code.
    - Context variables and job hierarchies (parent/child jobs) must be mapped to target parameters and orchestration.
  known_challenges:
    - Generated Java code is hard to review, so logic extraction relies on the Studio designs.
    - Product direction after the Qlik acquisition adds roadmap uncertainty.
  risks: [hidden-business-logic, skills-gap, licensing-overlap]
  strategies: [retain, replatform, refactor, retire]
  skills: [Talend development, Java, SQL]
  tags: [etl, batch, legacy]
