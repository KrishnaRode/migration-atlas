  legacy: true
  clouds: [on-prem]
  stage: null
  platforms: []
  operational_model: self-managed
  icon: workflow
  color: "#2E3192"
  description: High-performance parallel data processing platform built around graphs executed on the Co>Operating System, with Conduct>It and the EME metadata repository.
  typical_legacy_use: Very high-volume batch ETL in large banks, insurers and telcos, often processing mainframe files and loading Teradata.
  capabilities: [batch-etl, parallel-processing, data-transformation, metadata-repository, mainframe-file-processing]
  possible_targets: [lakeflow-declarative-pipelines, apache-spark, dbt, google-dataflow, databricks-workflows]
  alternatives: [informatica-powercenter, ibm-datastage]
  replaces: []
  suggested_next: [lakeflow-declarative-pipelines, apache-spark, databricks-workflows, dbt, reconciliation-framework]
  migration_considerations:
    - Documentation and tooling are proprietary and access-controlled; plan for vendor-mediated metadata export from the EME.
    - DML record formats and transform functions encode business rules and mainframe layouts.
    - Validate output parity on large volumes with automated reconciliation.
  known_challenges:
    - Scarce skills outside the incumbent team and limited public documentation.
    - Performance expectations set by the parallel engine must be matched on Spark.
  risks: [hidden-business-logic, skills-gap, performance-regression, lineage-loss]
