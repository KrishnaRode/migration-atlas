# Batch ETL / data integration tooling, legacy and cloud-native.
- id: informatica-powercenter
  name: Informatica PowerCenter
  aliases: [powercenter, informatica, infa pc, informatica powercenter, infa]
  vendor: Informatica
  category: etl
  role: etl
  layer: processing
  environment: on-prem
  legacy: true
  clouds: [on-prem]
  stage: null
  platforms: []
  operational_model: self-managed
  icon: workflow
  color: "#FF4D00"
  description: Informatica's on-premises, metadata-driven batch ETL platform built around mappings, sessions and workflows.
  typical_legacy_use: Enterprise-standard ETL loading the EDW and data marts from Oracle, SQL Server, mainframe and flat-file sources, scheduled by its own workflow manager or Control-M/AutoSys.
  capabilities: [batch-etl, data-transformation, workflow-orchestration, pushdown-optimization, metadata-repository]
  possible_targets: [lakeflow-declarative-pipelines, dbt, informatica-idmc, apache-spark, google-dataflow, azure-data-factory, aws-glue, databricks-workflows]
  alternatives: [ibm-datastage, talend, ab-initio, ssis, pentaho]
  replaces: []
  suggested_next: [lakeflow-declarative-pipelines, dbt, informatica-idmc, databricks-workflows, apache-airflow, landing-zone]
  migration_considerations:
    - Export repository metadata (XML) to inventory mappings, mapplets, reusable transformations, parameter files and workflows; size by complexity, not count.
    - Identify pushdown, SQL overrides, stored-procedure and lookup-heavy mappings; these carry business logic outside the visual design.
    - Decide between modernising to IDMC (lift with PowerCenter-to-cloud conversion tooling) and re-engineering to Spark/SQL-based pipelines.
    - Map workflow control logic (decision tasks, event waits, worklets) onto the target orchestrator.
    - Plan licence and support timelines for PowerCenter against the migration schedule.
  known_challenges:
    - Custom Java transformations and stored-procedure calls need manual rewrite.
    - SQL overrides in Source Qualifiers use source-database dialects that must also be converted.
    - Parameter files and environment-specific connections are scattered across servers.
  risks: [hidden-business-logic, skills-gap, scheduling-dependency-loss, lineage-loss, licensing-overlap]
  strategies: [retain, rehost, replatform, refactor, rearchitect, retire]
  skills: [Informatica development, SQL, Spark/SQL pipeline development]
  tags: [etl, batch, legacy]
  docs:
    - title: Informatica PowerCenter documentation
      url: https://docs.informatica.com/data-integration/powercenter.html

- id: ibm-datastage
  name: IBM DataStage
  aliases: [datastage, ibm datastage, infosphere datastage, ds jobs]
  vendor: IBM
  category: etl
  role: etl
  layer: processing
  environment: on-prem
  legacy: true
  clouds: [on-prem]
  stage: null
  platforms: []
  operational_model: self-managed
  icon: workflow
  color: "#1F70C1"
  description: IBM's parallel ETL engine (part of InfoSphere Information Server, now also offered in Cloud Pak for Data), using parallel and server jobs orchestrated by sequences.
  typical_legacy_use: High-volume batch ETL in banking, telco and insurance, loading Teradata, Db2, Netezza or Oracle warehouses.
  capabilities: [batch-etl, parallel-processing, data-transformation, job-sequencing]
  possible_targets: [lakeflow-declarative-pipelines, dbt, apache-spark, google-dataflow, azure-data-factory, aws-glue, databricks-workflows]
  alternatives: [informatica-powercenter, ab-initio, talend, ssis]
  replaces: []
  suggested_next: [lakeflow-declarative-pipelines, dbt, databricks-workflows, apache-airflow, landing-zone]
  migration_considerations:
    - Export job designs (DSX/ISX) to inventory parallel jobs, shared containers, routines and sequences.
    - Transformer stage derivations, BASIC routines and custom operators need careful translation.
    - Partitioning and sort strategies designed for the parallel engine should be redesigned rather than copied.
  known_challenges:
    - Server jobs and BASIC routines embed procedural logic.
    - Job sequences frequently shell out to scripts that hold extra logic.
  risks: [hidden-business-logic, skills-gap, scheduling-dependency-loss, lineage-loss]
  strategies: [retain, replatform, refactor, rearchitect, retire]
  skills: [DataStage development, SQL, Spark]
  tags: [etl, batch, legacy, ibm]
  docs:
    - title: IBM InfoSphere Information Server documentation
      url: https://www.ibm.com/docs/en/iis

- id: ssis
  name: SQL Server Integration Services (SSIS)
  aliases: [ssis, sql server integration services, integration services, dtsx]
  vendor: Microsoft
  category: etl
  role: etl
  layer: processing
  environment: on-prem
  legacy: true
  clouds: [on-prem, azure]
  stage: null
  platforms: []
  operational_model: self-managed
  icon: workflow
  color: "#CC2927"
  description: Microsoft's ETL component of SQL Server, building packages of control-flow and data-flow tasks.
  typical_legacy_use: Loads SQL Server data marts and warehouses from files, Oracle and other databases, scheduled through SQL Server Agent.
  capabilities: [batch-etl, data-transformation, control-flow, script-tasks]
  possible_targets: [azure-data-factory, microsoft-fabric, lakeflow-declarative-pipelines, dbt, databricks-workflows]
  alternatives: [informatica-powercenter, talend, ibm-datastage, pentaho]
  replaces: []
  suggested_next: [azure-data-factory, lakeflow-declarative-pipelines, dbt, databricks-workflows, microsoft-fabric]
  migration_considerations:
    - Azure Data Factory's Azure-SSIS Integration Runtime can rehost packages as an interim step before re-engineering.
    - Inventory Script Tasks/Components (C#/VB.NET), which contain custom logic.
    - Collect package configurations, environments and SQL Agent schedules together to retain dependencies.
  known_challenges:
    - Package logic often depends on T-SQL procedures in the source database.
    - Third-party SSIS components may not be supported in the target runtime.
  risks: [hidden-business-logic, stored-procedure-rewrite, scheduling-dependency-loss]
  strategies: [retain, rehost, replatform, refactor, retire]
  skills: [SSIS, T-SQL, Azure Data Factory]
  tags: [etl, batch, legacy, microsoft]
  docs:
    - title: SQL Server Integration Services documentation
      url: https://learn.microsoft.com/en-us/sql/integration-services/sql-server-integration-services

- id: talend
  name: Talend Data Integration
  aliases: [talend, talend open studio, talend di, qlik talend]
  vendor: Qlik (Talend)
  category: etl
  role: etl
  layer: processing
