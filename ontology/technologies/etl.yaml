  operational_model: managed
  icon: workflow
  color: "#4285F4"
  description: Google Cloud's managed, visual data integration service based on open-source CDAP, executing pipelines on Dataproc.
  typical_legacy_use: Visual ETL replacement for teams moving off GUI-based tools to Google Cloud, loading BigQuery and Cloud Storage.
  capabilities: [batch-etl, visual-pipelines, data-transformation, plugin-ecosystem, replication]
  possible_targets: [google-dataflow, dataform, dbt]
  alternatives: [azure-data-factory, aws-glue, informatica-idmc]
