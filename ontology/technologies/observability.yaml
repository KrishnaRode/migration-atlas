- id: azure-monitor
  name: Azure Monitor
  aliases: [azure monitor, log analytics, application insights]
  vendor: Microsoft
  category: observability
  role: observability
  layer: operations
  environment: cloud
  legacy: false
  clouds: [azure]
  stage: null
  platforms: []
  operational_model: managed
  icon: gauge
  color: "#0078D4"
  description: Azure's full-stack monitoring platform combining metrics, Log Analytics workspaces (KQL), Application Insights tracing and alerting.
  typical_legacy_use: Collects diagnostics from Data Factory, Synapse, Databricks, AKS and VMs into Log Analytics, with alerts and action groups for operations.
  capabilities: [monitoring, logging, alerting, metrics, tracing, dashboards]
  possible_targets: []
  alternatives: [datadog, grafana, prometheus]
  replaces: []
  suggested_next: [grafana, opentelemetry, microsoft-entra-id]
  migration_considerations:
    - Configure diagnostic settings on every data service to send logs to a central Log Analytics workspace.
    - Use Azure Policy to enforce diagnostic settings at scale.
    - Translate legacy monitoring rules into KQL-based log alerts and metric alerts with action groups.
  known_challenges:
    - Log Analytics ingestion cost requires table plans, commitment tiers and data collection rules.
    - Workspace design (centralised vs per-team) affects access control and query performance.
  risks: [operational-readiness, cost-overrun]
  strategies: [replatform]
  skills: [Azure operations, KQL]
  tags: [observability, monitoring, logging, azure]
  docs:
    - title: Azure Monitor documentation
      url: https://learn.microsoft.com/en-us/azure/azure-monitor/

