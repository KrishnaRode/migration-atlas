  environment: saas
  legacy: false
  clouds: [aws, azure, gcp, on-prem]
  stage: null
  platforms: []
  operational_model: saas
  icon: chart-line
  color: "#632CA6"
  description: SaaS observability platform unifying infrastructure metrics, logs, APM traces, data-jobs monitoring and alerting across clouds and on-premises.
  typical_legacy_use: Provides a single pane of glass for hybrid estates during migration, monitoring legacy servers alongside cloud data services via agents and integrations.
  capabilities: [monitoring, logging, alerting, metrics, tracing, apm, dashboards]
  possible_targets: []
  alternatives: [google-cloud-monitoring, amazon-cloudwatch, azure-monitor, grafana]
  replaces: []
  suggested_next: [opentelemetry, kubernetes, terraform]
  migration_considerations:
    - Enable cloud integrations and agents in both legacy and target environments to compare performance during parallel run.
    - Tag consistently (env, service, team, migration wave) to slice dashboards and costs.
    - Manage monitors and dashboards as code via the Terraform provider.
  known_challenges:
    - Host, custom metric and log-volume pricing can escalate during parallel run.
    - Overlap with cloud-native monitoring tools can create duplicated alerting.
  risks: [cost-overrun, licensing-overlap]
