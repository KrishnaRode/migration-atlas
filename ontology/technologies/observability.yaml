- id: opentelemetry
  name: OpenTelemetry
  aliases: [opentelemetry, otel]
  vendor: CNCF
  category: observability
  role: observability
  layer: operations
  environment: any
  legacy: false
  clouds: [any]
  stage: null
  platforms: []
  operational_model: self-managed
  icon: activity
  color: "#425CC7"
  description: Vendor-neutral CNCF standard, SDKs and Collector for generating and exporting traces, metrics and logs to any observability back end.
  typical_legacy_use: Instruments applications and pipelines once and exports telemetry to Datadog, Cloud Monitoring, CloudWatch or Prometheus, avoiding vendor-specific agents.
  capabilities: [tracing, metrics, logging, telemetry-collection, instrumentation]
  possible_targets: []
  alternatives: [datadog]
  replaces: []
  suggested_next: [prometheus, grafana, datadog, google-cloud-monitoring]
  migration_considerations:
    - Deploy the OpenTelemetry Collector as an agent or gateway to decouple instrumentation from back ends.
    - Propagate trace context across services and pipeline stages for end-to-end visibility.
    - Use semantic conventions so telemetry is consistent across teams.
  known_challenges:
    - Signal maturity varies by language SDK; logs support lags traces and metrics in some SDKs.
    - Sampling strategy must balance cost against diagnostic fidelity.
  risks: [skills-gap, operational-readiness]
  strategies: [refactor]
  skills: [OpenTelemetry, Distributed tracing]
  tags: [observability, tracing, open-standard, cncf]
  docs:
