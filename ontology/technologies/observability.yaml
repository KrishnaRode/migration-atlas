# Observability technologies: monitoring, logging, alerting, metrics and tracing.

- id: google-cloud-monitoring
  name: Google Cloud Monitoring
  aliases: [cloud monitoring, google cloud monitoring, stackdriver monitoring]
  vendor: Google Cloud
  category: observability
  role: observability
  layer: operations
  environment: cloud
  legacy: false
  clouds: [gcp]
  stage: null
  platforms: []
  operational_model: managed
  icon: gauge
  color: "#4285F4"
  description: Google Cloud's managed metrics, dashboards, uptime checks and alerting service, including Managed Service for Prometheus.
  typical_legacy_use: Monitors BigQuery, Dataflow, Pub/Sub, Composer and GKE workloads with service metrics, SLOs and alerting policies routed to on-call channels.
  capabilities: [monitoring, metrics, alerting, dashboards, slo-monitoring, uptime-checks]
  possible_targets: []
  alternatives: [datadog, prometheus, grafana]
  replaces: []
  suggested_next: [google-cloud-logging, opentelemetry, grafana]
  migration_considerations:
    - Define SLOs for migrated pipelines (freshness, latency, failure rate) and alert on them rather than raw metrics.
    - Use metrics scopes to monitor multiple projects from a central operations project.
    - Recreate legacy job-failure alerts from schedulers as alerting policies with notification channels.
  known_challenges:
    - Custom and high-cardinality metrics can drive unexpected cost.
    - Pipeline-level business metrics (row counts, lag) must be emitted explicitly.
  risks: [operational-readiness, cost-overrun]
  strategies: [replatform]
  skills: [Google Cloud operations, SRE practices]
  tags: [observability, monitoring, gcp]
  docs:
    - title: Cloud Monitoring documentation
      url: https://cloud.google.com/monitoring/docs

- id: google-cloud-logging
  name: Google Cloud Logging
  aliases: [cloud logging, google cloud logging, stackdriver logging]
  vendor: Google Cloud
  category: observability
  role: observability
  layer: operations
  environment: cloud
  legacy: false
  clouds: [gcp]
  stage: null
  platforms: []
  operational_model: managed
  icon: activity
  color: "#4285F4"
  description: Google Cloud's managed log ingestion, storage, search and routing service, including audit logs, log-based metrics and Log Analytics on BigQuery.
  typical_legacy_use: Centralises application, pipeline and Cloud Audit Logs, routing them via sinks to log buckets, BigQuery or SIEM tools for compliance retention.
  capabilities: [logging, audit-logging, log-analytics, log-based-metrics, alerting]
  possible_targets: []
  alternatives: [datadog, azure-monitor, amazon-cloudwatch]
  replaces: []
  suggested_next: [google-cloud-monitoring, bigquery, google-pubsub]
  migration_considerations:
    - Enable Data Access audit logs for sensitive datasets; they are off by default for most services.
    - Design aggregated sinks at organisation or folder level for central retention.
    - Set retention and exclusion filters to control ingestion cost.
  known_challenges:
    - Verbose debug logging from migrated jobs can create large ingestion bills.
    - Correlating logs across services requires consistent trace and job identifiers.
  risks: [operational-readiness, cost-overrun, regulatory-compliance]
  strategies: [replatform]
  skills: [Google Cloud operations, Log analysis]
  tags: [observability, logging, gcp]
  docs:
    - title: Cloud Logging documentation
      url: https://cloud.google.com/logging/docs

- id: amazon-cloudwatch
  name: Amazon CloudWatch
  aliases: [cloudwatch, amazon cloudwatch, aws cloudwatch]
  vendor: Amazon Web Services
  category: observability
  role: observability
  layer: operations
  environment: cloud
  legacy: false
  clouds: [aws]
  stage: null
  platforms: []
  operational_model: managed
  icon: gauge
  color: "#E7157B"
  description: AWS monitoring and observability service for metrics, logs, alarms, dashboards and events across AWS resources and applications.
  typical_legacy_use: Collects metrics and logs from Glue, EMR, Lambda, Redshift and MWAA, with alarms routed through SNS to operations teams.
  capabilities: [monitoring, logging, alerting, metrics, dashboards, tracing]
  possible_targets: []
  alternatives: [datadog, prometheus, grafana]
  replaces: []
  suggested_next: [opentelemetry, grafana, aws-iam]
  migration_considerations:
    - Standardise log groups, retention and metric namespaces per workload and environment.
    - Use cross-account observability to aggregate metrics and logs in a central monitoring account.
    - Recreate scheduler-based failure notifications as CloudWatch alarms or EventBridge rules.
  known_challenges:
    - Log ingestion and custom metrics pricing grows quickly without retention policies.
    - Metric granularity and query capabilities differ from dedicated APM tools.
  risks: [operational-readiness, cost-overrun]
  strategies: [replatform]
  skills: [AWS operations, SRE practices]
  tags: [observability, monitoring, logging, aws]
  docs:
