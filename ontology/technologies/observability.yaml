- id: prometheus
  name: Prometheus
  aliases: [prometheus, promql]
  vendor: CNCF
  category: observability
  role: observability
  layer: operations
  environment: any
  legacy: false
  clouds: [any]
  stage: null
  platforms: []
  operational_model: self-managed
  icon: activity
  color: "#E6522C"
  description: Open-source CNCF time-series monitoring system with a pull-based scrape model, PromQL query language and Alertmanager.
  typical_legacy_use: Monitors Kubernetes clusters, Kafka, Spark and custom services via exporters, often paired with Grafana for dashboards.
  capabilities: [monitoring, metrics, alerting, time-series]
  possible_targets: [google-cloud-monitoring, amazon-cloudwatch, azure-monitor]
  alternatives: [datadog, google-cloud-monitoring, amazon-cloudwatch]
  replaces: []
  suggested_next: [grafana, kubernetes, opentelemetry]
  migration_considerations:
    - Consider managed Prometheus offerings (Google, AWS, Azure) to avoid operating long-term storage.
    - Migrate recording rules and alert rules as code alongside workloads.
    - Control label cardinality on migrated exporters.
  known_challenges:
    - Long-term retention and high availability need Thanos, Cortex/Mimir or a managed service.
    - Not designed for logs or traces; needs complementary tools.
  risks: [operational-readiness, skills-gap]
  strategies: [retain, replatform]
  skills: [Prometheus, PromQL, Kubernetes]
  tags: [observability, metrics, open-source, cncf]
  docs:
    - title: Prometheus documentation
      url: https://prometheus.io/docs/introduction/overview/

