  icon: calendar-clock
  color: "#00A0DF"
  description: Enterprise workload automation and job scheduling platform (formerly Cisco Tidal Enterprise Scheduler), now part of Redwood.
  typical_legacy_use: Schedules ERP, ETL and database batch jobs with calendars and cross-system dependencies.
  capabilities: [workload-automation, calendars, job-dependencies, erp-adapters]
  possible_targets: [databricks-workflows, apache-airflow, cloud-composer, amazon-mwaa, aws-step-functions, google-cloud-scheduler]
