- id: databricks-workflows
  name: Databricks Workflows (Lakeflow Jobs)
  aliases: [databricks workflows, databricks jobs, lakeflow jobs]
  vendor: Databricks
  category: orchestration
  role: orchestrator
  layer: operations
  environment: cloud
  legacy: false
  clouds: [aws, azure, gcp]
  stage: null
  platforms: [databricks]
  operational_model: managed
  icon: workflow
  color: "#FF3621"
  description: Databricks' native orchestration service (now branded Lakeflow Jobs) for scheduling multi-task jobs of notebooks, pipelines, SQL, dbt and Python on Databricks.
  typical_legacy_use: Replaces enterprise schedulers and Airflow for workloads that run predominantly on Databricks, with file-arrival and table-update triggers.
  capabilities: [workflow-orchestration, task-dependencies, triggers, retries, serverless-jobs, repair-runs]
  possible_targets: []
  alternatives: [apache-airflow, cloud-composer, amazon-mwaa, aws-step-functions]
  replaces: [control-m, autosys, tidal, cron, informatica-powercenter]
  suggested_next: [lakeflow-declarative-pipelines, databricks-asset-bundles, dbt, unity-catalog, lakehouse-monitoring]
  migration_considerations:
    - Best fit when most tasks run on Databricks; cross-platform orchestration may still need an enterprise scheduler or Airflow.
    - Define jobs as code with Databricks Asset Bundles for environment promotion.
    - Map legacy calendars and cross-job dependencies onto triggers and job-to-job tasks.
  known_challenges:
    - Business calendars and complex holiday rules are not native and require custom handling.
    - Enterprise-wide visibility across non-Databricks jobs requires integration with existing schedulers.
  risks: [scheduling-dependency-loss, vendor-lock-in]
  strategies: [replatform, refactor]
  skills: [Databricks, Python, CI/CD]
  tags: [orchestrator, databricks, managed]
  docs:
    - title: Lakeflow Jobs documentation
      url: https://docs.databricks.com/aws/en/jobs/

- id: aws-step-functions
  name: AWS Step Functions
  aliases: [step functions, aws step functions, sfn]
  vendor: Amazon Web Services
  category: orchestration
  role: orchestrator
  layer: operations
  environment: cloud
  legacy: false
  clouds: [aws]
  stage: null
  platforms: []
  operational_model: serverless
  icon: git-branch
  color: "#FF4F8B"
  description: AWS's serverless workflow service that coordinates AWS services and Lambda functions as state machines defined in Amazon States Language.
  typical_legacy_use: Orchestrates event-driven and batch data workflows (Glue, EMR, Lambda, Batch) on AWS, often triggered by EventBridge schedules.
  capabilities: [workflow-orchestration, serverless, service-integrations, error-handling, parallel-states]
  possible_targets: []
  alternatives: [amazon-mwaa, apache-airflow, databricks-workflows]
  replaces: [control-m, autosys, tidal, cron]
  suggested_next: [aws-glue, amazon-emr, amazon-cloudwatch, aws-iam]
  migration_considerations:
    - Choose Standard versus Express workflows based on duration and execution-volume patterns.
    - Use EventBridge Scheduler for time-based triggers; Step Functions itself does not hold calendars.
    - Express complex dependency graphs carefully; very large graphs are easier to maintain in Airflow.
  known_challenges:
    - JSON/ASL definitions become hard to maintain for large job estates.
    - State transition pricing can surprise high-frequency workloads.
  risks: [vendor-lock-in, cost-overrun, scheduling-dependency-loss]
  strategies: [replatform, refactor]
  skills: [AWS, serverless design, Amazon States Language]
  tags: [orchestrator, aws, serverless]
  docs:
    - title: AWS Step Functions documentation
      url: https://docs.aws.amazon.com/step-functions/

- id: google-cloud-scheduler
  name: Cloud Scheduler
  aliases: [cloud scheduler, google cloud scheduler, gcp scheduler]
  vendor: Google Cloud
  category: orchestration
  role: orchestrator
  layer: operations
  environment: cloud
  legacy: false
  clouds: [gcp]
  stage: null
  platforms: []
  operational_model: serverless
  icon: clock
  color: "#4285F4"
  description: Google Cloud's fully managed cron service that triggers HTTP targets, Pub/Sub topics and App Engine on a schedule.
  typical_legacy_use: Replaces server crontabs for simple time-based triggers of Cloud Run jobs, Cloud Functions, Workflows or pipeline APIs.
  capabilities: [time-based-scheduling, serverless, http-triggers, pubsub-triggers, retries]
  possible_targets: [cloud-composer]
  alternatives: [cloud-composer, aws-step-functions]
  replaces: [cron]
  suggested_next: [google-pubsub, cloud-composer, google-cloud-monitoring, google-iam]
  migration_considerations:
    - Suitable for independent scheduled triggers only; it has no dependency management between jobs.
    - Use service accounts with OIDC/OAuth tokens for authenticated targets.
    - Escalate to Cloud Composer or Workflows when jobs need sequencing, retries across steps or backfills.
  known_challenges:
    - Misused as a dependency orchestrator, it recreates cron-style implicit timing chains.
    - Job execution status and logs live in the triggered service, so end-to-end monitoring must be assembled separately.
  risks: [scheduling-dependency-loss, operational-readiness]
  strategies: [replatform, refactor]
  skills: [Google Cloud, IAM]
  tags: [scheduler, gcp, serverless]
  docs:
    - title: Cloud Scheduler documentation
      url: https://cloud.google.com/scheduler/docs
