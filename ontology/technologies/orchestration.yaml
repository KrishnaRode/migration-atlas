  category: orchestration
  role: orchestrator
  layer: operations
  environment: cloud
  legacy: false
  clouds: [gcp]
  stage: null
  platforms: []
  operational_model: managed
  icon: wind
  color: "#4285F4"
  description: Google Cloud's managed Apache Airflow service.
  typical_legacy_use: Orchestrates BigQuery, Dataflow, Dataproc and Databricks-on-GCP pipelines, replacing on-premises schedulers in GCP migrations.
  capabilities: [workflow-orchestration, managed-airflow, gcp-operators, autoscaling]
  possible_targets: []
  alternatives: [amazon-mwaa, databricks-workflows, google-cloud-scheduler]
  replaces: [control-m, autosys, tidal, cron, apache-airflow]
  suggested_next: [bigquery, google-dataflow, google-dataproc, google-cloud-monitoring, google-secret-manager]
