- id: amazon-mwaa
  name: Amazon MWAA
  aliases: [mwaa, amazon mwaa, managed workflows for apache airflow]
  vendor: Amazon Web Services
  category: orchestration
  role: orchestrator
  layer: operations
  environment: cloud
  legacy: false
  clouds: [aws]
  stage: null
  platforms: []
  operational_model: managed
  icon: wind
  color: "#FF9900"
  description: Amazon Managed Workflows for Apache Airflow, AWS's managed Airflow service.
  typical_legacy_use: Orchestrates Glue, EMR, Redshift and Databricks-on-AWS pipelines when replacing on-premises schedulers in AWS migrations.
  capabilities: [workflow-orchestration, managed-airflow, aws-operators, autoscaling-workers]
  possible_targets: []
  alternatives: [cloud-composer, aws-step-functions, databricks-workflows]
  replaces: [control-m, autosys, tidal, cron, apache-airflow]
  suggested_next: [aws-glue, amazon-emr, amazon-redshift, amazon-cloudwatch, aws-secrets-manager]
  migration_considerations:
    - Choose environment class and worker limits to match concurrency; there is a baseline cost per environment.
    - DAGs, plugins and requirements are deployed via S3; integrate with CI/CD.
    - Supported Airflow versions lag upstream; confirm feature availability.
  known_challenges:
    - Limited control over the underlying infrastructure compared with self-managed Airflow.
    - Private networking and VPC endpoint configuration add setup complexity.
