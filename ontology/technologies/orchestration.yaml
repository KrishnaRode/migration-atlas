- id: cron
  name: cron
  aliases: [cron, crontab, cron jobs, unix cron]
  vendor: Open source (Unix/Linux)
  category: orchestration
  role: orchestrator
  layer: operations
  environment: on-prem
  legacy: true
  clouds: [on-prem, any]
  stage: null
  platforms: []
  operational_model: self-managed
  icon: clock
  color: "#475569"
  description: The time-based job scheduler built into Unix-like operating systems, driven by per-user and system crontab files.
  typical_legacy_use: Runs shell scripts, ETL command lines and database jobs on individual servers, often with dependencies managed implicitly by start times.
  capabilities: [time-based-scheduling]
  possible_targets: [databricks-workflows, apache-airflow, cloud-composer, amazon-mwaa, aws-step-functions, google-cloud-scheduler]
  alternatives: [control-m, autosys, tidal]
  replaces: []
  suggested_next: [apache-airflow, databricks-workflows, google-cloud-scheduler, aws-step-functions, cloud-composer]
  migration_considerations:
    - Discover crontabs across all servers and service accounts; they are rarely centrally documented.
    - Replace time-offset sequencing with explicit dependencies in the target orchestrator.
    - Add retries, alerting and logging that cron does not provide.
  known_challenges:
    - Implicit dependencies (job B starts 30 minutes after job A) break silently when runtimes change.
    - Scripts often depend on local files, credentials and environment variables on the host.
  risks: [scheduling-dependency-loss, hidden-business-logic, security-gap]
  strategies: [refactor, retire]
  skills: [Linux administration, shell scripting]
  tags: [scheduler, unix, legacy]
  docs:
    - title: crontab(5) manual page
      url: https://man7.org/linux/man-pages/man5/crontab.5.html

- id: apache-airflow
  name: Apache Airflow
  aliases: [airflow, apache airflow, airflow dags]
  vendor: Apache Software Foundation
  category: orchestration
  role: orchestrator
  layer: operations
  environment: any
  legacy: false
  clouds: [on-prem, aws, azure, gcp]
  stage: null
  platforms: []
  operational_model: self-managed
  icon: wind
  color: "#017CEE"
  description: Open-source platform to author, schedule and monitor workflows as Python-defined DAGs, with a large provider ecosystem.
  typical_legacy_use: Orchestrates data pipelines across warehouses, lakehouses, Spark, dbt and cloud services; frequently the replacement for enterprise schedulers in data teams.
  capabilities: [workflow-orchestration, python-dags, dependency-management, retries, backfills, provider-operators]
  possible_targets: [cloud-composer, amazon-mwaa, databricks-workflows]
  alternatives: [databricks-workflows, aws-step-functions, control-m]
  replaces: [control-m, autosys, tidal, cron]
  suggested_next: [dbt, databricks-workflows, google-cloud-monitoring, amazon-cloudwatch, github-actions]
  migration_considerations:
    - Choose self-managed (e.g. on Kubernetes) versus managed (Cloud Composer, MWAA) based on operational capacity.
    - Plan Airflow 2 to Airflow 3 upgrade implications (API, DAG authoring changes) for new builds.
    - Keep heavy processing out of Airflow workers; trigger external engines instead.
  known_challenges:
    - Scheduler and metadata-database scaling require tuning for thousands of DAGs.
    - Business calendars and SLA monitoring need custom implementation.
  risks: [operational-readiness, skills-gap, scheduling-dependency-loss]
  strategies: [replatform, refactor]
  skills: [Python, Airflow, DevOps]
  tags: [orchestrator, open-source, python]
  docs:
    - title: Apache Airflow documentation
      url: https://airflow.apache.org/docs/

- id: cloud-composer
  name: Cloud Composer
  aliases: [cloud composer, gcp composer, google cloud composer]
