# Workload schedulers and workflow orchestrators.
- id: control-m
  name: BMC Control-M
  aliases: [control-m, control m, controlm, bmc control-m]
  vendor: BMC
  category: orchestration
  role: orchestrator
  layer: operations
  environment: on-prem
  legacy: true
  clouds: [on-prem, aws, azure, gcp]
  stage: null
  platforms: []
  operational_model: self-managed
  icon: calendar-clock
  color: "#FE5000"
  description: BMC's enterprise workload automation platform scheduling batch jobs across mainframe, distributed systems, ETL tools and cloud services (also available as Control-M SaaS / Helix Control-M).
  typical_legacy_use: Central scheduler for nightly batch, coordinating mainframe JCL, ETL workflows, file transfers and database jobs with calendars, conditions and SLA management.
  capabilities: [workload-automation, calendars, cross-platform-dependencies, sla-management, managed-file-transfer, jobs-as-code]
  possible_targets: [databricks-workflows, apache-airflow, cloud-composer, amazon-mwaa, aws-step-functions, google-cloud-scheduler]
  alternatives: [autosys, tidal, apache-airflow]
  replaces: [cron]
  suggested_next: [databricks-workflows, apache-airflow, cloud-composer, amazon-mwaa, aws-step-functions]
  migration_considerations:
    - Export job definitions (XML/JSON via Automation API) to build the full dependency graph, including in/out conditions, calendars and resources.
    - Decide whether Control-M remains the enterprise scheduler (triggering cloud jobs through its integrations) or is replaced per platform.
    - Map calendars, holiday rules and SLA alerts explicitly; native cloud orchestrators lack rich business calendars.
    - Cross-application dependencies often span teams; agree ownership before splitting schedules.
  known_challenges:
    - Implicit dependencies through shared files or conditions are easy to lose when splitting schedules across tools.
    - Thousands of jobs with inconsistent naming make automated conversion noisy.
  risks: [scheduling-dependency-loss, operational-readiness, licensing-overlap]
  strategies: [retain, replatform, refactor, retire]
  skills: [Control-M administration, workload scheduling, Airflow or Databricks Workflows]
  tags: [scheduler, batch, legacy]
  docs:
    - title: BMC Control-M
      url: https://www.bmc.com/it-solutions/control-m.html

- id: autosys
  name: AutoSys Workload Automation
  aliases: [autosys, ca autosys, broadcom autosys, autosys workload automation, jil]
  vendor: Broadcom
  category: orchestration
  role: orchestrator
  layer: operations
  environment: on-prem
  legacy: true
  clouds: [on-prem]
  stage: null
  platforms: []
  operational_model: self-managed
  icon: calendar-clock
  color: "#CC092F"
  description: Broadcom's (formerly CA) enterprise job scheduler defining jobs, boxes and conditions in JIL.
  typical_legacy_use: Schedules batch workloads on UNIX/Windows servers, ETL tools and database jobs, common in financial services.
  capabilities: [workload-automation, job-dependencies, calendars, box-jobs, file-watchers]
  possible_targets: [databricks-workflows, apache-airflow, cloud-composer, amazon-mwaa, aws-step-functions, google-cloud-scheduler]
  alternatives: [control-m, tidal]
  replaces: [cron]
  suggested_next: [databricks-workflows, apache-airflow, cloud-composer, amazon-mwaa, aws-step-functions]
  migration_considerations:
    - Export JIL definitions and parse boxes, conditions (success/failure/done), calendars and file watchers into a dependency graph.
    - Jobs frequently call shell scripts that contain logic; inventory those scripts too.
    - Replicate alerting, restart and on-hold/on-ice operational procedures in the target.
  known_challenges:
    - Global variables and cross-instance dependencies are hard to reproduce.
    - Box-job semantics do not map one-to-one onto DAG task groups.
  risks: [scheduling-dependency-loss, hidden-business-logic, operational-readiness]
  strategies: [retain, replatform, refactor, retire]
  skills: [AutoSys administration, JIL, workload scheduling]
  tags: [scheduler, batch, legacy]
  docs:
    - title: Broadcom TechDocs (AutoSys Workload Automation)
      url: https://techdocs.broadcom.com/

