# Operational databases, legacy MPP warehouses and modern managed relational targets.
- id: oracle-database
  name: Oracle Database
  aliases: [oracle, oracle db, oracle database, oracle rdbms, oracle 19c, oracle 12c]
  vendor: Oracle
  category: databases
  role: source-database
  layer: sources
  environment: on-prem
  legacy: true
  clouds: [on-prem, aws, azure, gcp]
  stage: null
  platforms: []
  operational_model: self-managed
  icon: database
  color: "#C74634"
  description: Oracle's flagship relational database management system, used for OLTP and mixed analytical workloads.
  typical_legacy_use: Backbone for core transactional systems (ERP, billing, banking cores) and departmental data marts, often with heavy PL/SQL business logic, RAC clustering and Data Guard for HA/DR.
  capabilities: [oltp, sql, pl-sql, stored-procedures, partitioning, high-availability, redo-log-cdc]
  possible_targets: [alloydb, cloud-sql, amazon-aurora, azure-sql-database, postgresql, databricks, bigquery, snowflake]
  alternatives: [sql-server, ibm-db2, postgresql, mysql, sybase-ase]
  replaces: []
  suggested_next: [lakeflow-connect, google-datastream, oracle-goldengate, aws-dms, qlik-replicate, apache-kafka, landing-zone, informatica-powercenter]
  migration_considerations:
    - Inventory PL/SQL packages, triggers, sequences and scheduled DBMS_JOB/DBMS_SCHEDULER jobs; they frequently carry business rules that must be rewritten.
    - Map Oracle types carefully (NUMBER without precision, DATE carrying time, empty string treated as NULL, TIMESTAMP WITH LOCAL TIME ZONE).
    - CDC from redo/archive logs requires supplemental logging and appropriate privileges (LogMiner, XStream or GoldenGate); confirm with the DBA team early.
    - Review Oracle licensing (processor/NUP, options such as Partitioning and Advanced Compression) to time decommissioning and avoid paying twice during parallel run.
    - Size initial load against network bandwidth; large historical tables may need export to files or offline transfer.
  known_challenges:
    - Proprietary SQL constructs (CONNECT BY, MERGE variants, analytic extensions, optimizer hints) need dialect conversion.
    - Implicit commit semantics and autonomous transactions do not translate directly to most targets.
    - RAC and Exadata-specific performance assumptions can mask poorly written SQL that regresses elsewhere.
  risks: [stored-procedure-rewrite, sql-dialect-conversion, data-type-mismatch, licensing-overlap, cdc-lag, cutover-downtime]
  strategies: [retain, rehost, replatform, refactor, rearchitect, retire]
  skills: [Oracle DBA, PL/SQL, SQL tuning, CDC configuration]
  tags: [rdbms, oltp, legacy, oracle]
  docs:
    - title: Oracle Database documentation
      url: https://docs.oracle.com/en/database/oracle/oracle-database/

- id: sql-server
  name: Microsoft SQL Server
  aliases: [sql server, mssql, ms sql, microsoft sql server, sqlserver, tsql database]
  vendor: Microsoft
  category: databases
  role: source-database
  layer: sources
  environment: on-prem
  legacy: true
  clouds: [on-prem, aws, azure, gcp]
  stage: null
  platforms: []
  operational_model: self-managed
  icon: database
  color: "#CC2927"
  description: Microsoft's relational database engine for OLTP, data marts and BI workloads, programmed with T-SQL.
  typical_legacy_use: Line-of-business application databases and departmental warehouses, frequently paired with SSIS for ETL, SSRS for reporting and SQL Agent for scheduling.
  capabilities: [oltp, sql, t-sql, stored-procedures, columnstore, change-tracking, cdc]
  possible_targets: [azure-sql-database, amazon-aurora, cloud-sql, alloydb, databricks, azure-synapse, microsoft-fabric, snowflake]
  alternatives: [oracle-database, postgresql, mysql, ibm-db2, sybase-ase]
  replaces: [sybase-ase]
  suggested_next: [lakeflow-connect, azure-dms, aws-dms, google-datastream, qlik-replicate, debezium, landing-zone, ssis]
  migration_considerations:
    - Decide between native CDC and Change Tracking for incremental extraction; both must be enabled per database/table and have retention implications.
    - Catalogue SQL Agent jobs, linked servers, CLR assemblies and cross-database queries; they create hidden dependencies.
    - T-SQL procedures, temp tables and table variables need rewriting for non-Microsoft targets.
    - Check collation and case-sensitivity differences, especially when moving to case-sensitive engines.
  known_challenges:
    - Linked-server and distributed-transaction patterns break when databases move to separate cloud services.
    - Heavy use of SSIS packages and SSRS reports expands scope beyond the database itself.
    - DATETIME precision and UNIQUEIDENTIFIER/MONEY types need explicit mapping.
  risks: [stored-procedure-rewrite, sql-dialect-conversion, data-type-mismatch, integration-breakage, licensing-overlap]
  strategies: [retain, rehost, replatform, refactor, rearchitect, retire]
  skills: [SQL Server DBA, T-SQL, SSIS, Azure data services]
  tags: [rdbms, oltp, legacy, microsoft]
  docs:
    - title: SQL Server documentation
      url: https://learn.microsoft.com/en-us/sql/sql-server/

- id: postgresql
  name: PostgreSQL
  aliases: [postgres, postgresql, psql database]
  vendor: PostgreSQL Global Development Group
  category: databases
  role: source-database
  layer: sources
  environment: on-prem
  legacy: true
  clouds: [on-prem, aws, azure, gcp]
  stage: null
  platforms: []
  operational_model: self-managed
  icon: database
  color: "#336791"
  description: Open-source object-relational database with strong SQL standards compliance and a rich extension ecosystem.
  typical_legacy_use: Self-managed application databases for custom and open-source software, sometimes as the landing database after an earlier Oracle exit.
  capabilities: [oltp, sql, pl-pgsql, extensions, json, logical-replication]
  possible_targets: [alloydb, cloud-sql, amazon-aurora, azure-sql-database, databricks, bigquery, snowflake]
  alternatives: [mysql, oracle-database, sql-server]
  replaces: [oracle-database, sybase-ase]
  suggested_next: [lakeflow-connect, google-datastream, aws-dms, debezium, azure-dms, qlik-replicate, apache-kafka, landing-zone]
  migration_considerations:
    - Logical replication slots are required for log-based CDC; set wal_level=logical and monitor slot lag to avoid WAL bloat.
    - Validate that installed extensions (PostGIS, pg_partman, pgcrypto, etc.) are supported on the managed target.
    - Tables without primary keys need REPLICA IDENTITY settings for update/delete capture.
    - Major-version upgrades can be combined with the move; test planner behaviour changes.
  known_challenges:
    - Unconsumed replication slots can fill disk on the source if CDC tooling stalls.
    - Custom extensions or C functions may be unavailable on managed services.
  risks: [cdc-lag, schema-drift, performance-regression, operational-readiness]
  strategies: [retain, rehost, replatform, refactor, retire]
  skills: [PostgreSQL DBA, SQL, PL/pgSQL]
  tags: [rdbms, oltp, open-source]
  docs:
    - title: PostgreSQL documentation
      url: https://www.postgresql.org/docs/

- id: mysql
  name: MySQL
  aliases: [mysql, my sql, mariadb]
  vendor: Oracle
  category: databases
  role: source-database
  layer: sources
  environment: on-prem
  legacy: true
  clouds: [on-prem, aws, azure, gcp]
  stage: null
  platforms: []
  operational_model: self-managed
  icon: database
  color: "#00758F"
  description: Widely deployed open-source relational database, common behind web and SaaS-style applications.
  typical_legacy_use: Self-managed back ends for web applications, e-commerce platforms and packaged open-source software, often with primary/replica topologies.
  capabilities: [oltp, sql, binlog-replication, json]
  possible_targets: [cloud-sql, amazon-aurora, alloydb, azure-sql-database, databricks, bigquery, snowflake]
  alternatives: [postgresql, sql-server, oracle-database]
  replaces: []
  suggested_next: [lakeflow-connect, google-datastream, aws-dms, debezium, azure-dms, qlik-replicate, apache-kafka, landing-zone]
  migration_considerations:
    - Log-based CDC requires binlog_format=ROW (and binlog_row_image=FULL) plus sufficient binlog retention.
    - Check storage engines; MyISAM tables are non-transactional and complicate consistent snapshots.
    - Validate SQL mode, character set (utf8 vs utf8mb4) and collation differences on the target.
  known_challenges:
    - Zero-date values and lenient SQL modes produce data that stricter targets reject.
    - Short binlog retention on busy replicas can force full re-snapshots after CDC outages.
  risks: [data-type-mismatch, cdc-lag, data-quality-regression]
  strategies: [retain, rehost, replatform, refactor, retire]
  skills: [MySQL DBA, SQL]
  tags: [rdbms, oltp, open-source]
  docs:
    - title: MySQL documentation
      url: https://dev.mysql.com/doc/

- id: ibm-db2
  name: IBM Db2 (LUW)
  aliases: [db2, ibm db2, db2 luw, db2 linux, udb, db2 udb]
  vendor: IBM
  category: databases
  role: source-database
  layer: sources
  environment: on-prem
  legacy: true
  clouds: [on-prem]
  stage: null
  platforms: []
  operational_model: self-managed
  icon: database
  color: "#1F70C1"
  description: IBM's relational database for Linux, UNIX and Windows (distinct from Db2 for z/OS).
  typical_legacy_use: Back end for packaged and in-house applications in banking, insurance and retail, and for data warehouses built on Db2 Database Partitioning Feature.
  capabilities: [oltp, sql, sql-pl, stored-procedures, partitioning, high-availability]
  possible_targets: [alloydb, cloud-sql, amazon-aurora, azure-sql-database, postgresql, databricks, bigquery, snowflake]
  alternatives: [oracle-database, sql-server, postgresql]
  replaces: []
  suggested_next: [qlik-replicate, aws-dms, lakeflow-connect, striim, debezium, landing-zone, ibm-datastage, informatica-powercenter]
  migration_considerations:
    - Confirm the CDC path (IBM InfoSphere Data Replication, Qlik Replicate, DMS) and the log retention/archive settings it needs.
    - Convert SQL PL procedures and Db2-specific syntax (FETCH FIRST, special registers, sequences).
    - Map DECIMAL, GRAPHIC/VARGRAPHIC and timestamp precision explicitly.
    - Check whether Db2 is bundled with an application licence that constrains what can move.
  known_challenges:
    - Fewer native cloud CDC connectors than Oracle or SQL Server; verify connector support per tool.
    - Db2 skills are increasingly scarce, slowing analysis of procedural code.
  risks: [stored-procedure-rewrite, sql-dialect-conversion, data-type-mismatch, skills-gap]
  strategies: [retain, rehost, replatform, refactor, rearchitect, retire]
  skills: [Db2 DBA, SQL PL, CDC configuration]
  tags: [rdbms, oltp, legacy, ibm]
  docs:
    - title: IBM Db2 documentation
      url: https://www.ibm.com/docs/en/db2

- id: teradata
  name: Teradata
  aliases: [teradata, teradata vantage, teradata edw]
  vendor: Teradata
  category: databases
  role: legacy-warehouse
  layer: sources
  environment: on-prem
  legacy: true
  clouds: [on-prem, aws, azure, gcp]
  stage: null
  platforms: []
  operational_model: self-managed
  icon: server
  color: "#F37440"
  description: Shared-nothing MPP data warehouse platform (Teradata Vantage) for large-scale enterprise analytics.
  typical_legacy_use: Enterprise data warehouse holding integrated, historical data, loaded by BTEQ/TPT scripts and ETL tools and queried by BI tools and analysts.
  capabilities: [mpp, sql, bteq, tpt-loading, workload-management, stored-procedures]
  possible_targets: [databricks, snowflake, bigquery, amazon-redshift, azure-synapse, microsoft-fabric]
  alternatives: [netezza, greenplum, oracle-exadata]
  replaces: []
  suggested_next: [databricks, landing-zone, lakeflow-declarative-pipelines, dbt, reconciliation-framework, informatica-powercenter, aws-dms]
  migration_considerations:
    - Inventory BTEQ, TPT, FastLoad/MultiLoad scripts and macros; they hold much of the transformation logic.
    - Translate Teradata SQL (QUALIFY, SET tables, PERIOD types, case-insensitive defaults) to the target dialect; automated converters cover most but not all.
    - Plan historical data offload with TPT export or parallel extract; volumes are typically tens to hundreds of TB.
    - Re-design primary index and partitioning choices for the target's clustering/partitioning model.
    - Run reconciliation (row counts, checksums, aggregate comparisons) across a parallel-run period before decommissioning.
  known_challenges:
    - SET-table duplicate elimination and case-insensitive comparisons silently change results if not handled.
    - Workload-management rules and concurrency behaviour do not map one-to-one to cloud warehouses.
    - Contract renewal dates drive aggressive timelines.
  risks: [sql-dialect-conversion, hidden-business-logic, data-volume-transfer, report-parity, licensing-overlap, parallel-run-cost]
  strategies: [retain, replatform, refactor, rearchitect, retire]
  skills: [Teradata SQL, BTEQ/TPT, data warehouse modelling]
  tags: [mpp, edw, legacy, warehouse]
  docs:
    - title: Teradata documentation
      url: https://docs.teradata.com/

