- id: oracle-exadata
  name: Oracle Exadata
  aliases: [exadata, oracle exadata, exadata database machine]
  vendor: Oracle
  category: databases
  role: legacy-warehouse
  layer: sources
  environment: on-prem
  legacy: true
  clouds: [on-prem, aws, azure, gcp]
  stage: null
  platforms: []
  operational_model: self-managed
  icon: server
  color: "#C74634"
  description: Oracle's engineered database platform combining Oracle Database with smart-scan storage servers and high-speed interconnect.
  typical_legacy_use: Consolidated platform for large Oracle OLTP and data warehouse workloads, frequently hosting the enterprise EDW with heavy PL/SQL ETL.
  capabilities: [oltp, mpp-like-scans, sql, pl-sql, hybrid-columnar-compression, smart-scan]
  possible_targets: [databricks, snowflake, bigquery, amazon-redshift, azure-synapse, alloydb, amazon-aurora]
  alternatives: [teradata, netezza, greenplum]
  replaces: []
  suggested_next: [lakeflow-connect, oracle-goldengate, google-datastream, aws-dms, qlik-replicate, landing-zone, databricks, informatica-powercenter]
  migration_considerations:
    - Hybrid Columnar Compression and smart-scan offload hide inefficient SQL; benchmark critical queries on the target.
    - Distinguish workloads that should move to a lakehouse/warehouse from OLTP that may stay on Oracle (including Exadata Cloud or Oracle Database@cloud offerings).
    - PL/SQL-based ETL frameworks must be rewritten as pipelines or SQL transformations.
    - Plan bulk export of compressed data; uncompressed volume can be many times the on-disk size.
  known_challenges:
    - Exadata-specific performance does not translate directly; performance regression is common without redesign.
    - Licence and hardware refresh cycles constrain the cutover window.
  risks: [performance-regression, stored-procedure-rewrite, data-volume-transfer, licensing-overlap, sql-dialect-conversion]
