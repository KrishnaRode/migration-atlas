  known_challenges:
    - Request-rate and small-file patterns impact downstream query performance and cost.
    - Cross-region replication and egress costs need explicit budgeting.
  risks: [data-volume-transfer, network-bandwidth, security-gap, cost-overrun]
  strategies: [replatform, rearchitect]
