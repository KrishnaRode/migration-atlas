  icon: hard-drive
  color: "#569A31"
  description: Highly durable, strongly consistent object storage on AWS with multiple storage classes, versioning, Object Lock and S3 Tables for managed Iceberg.
  typical_legacy_use: The de-facto data-lake storage layer on AWS for raw files, extracts, logs and table formats used by EMR, Glue, Athena, Redshift Spectrum and Databricks.
  capabilities: [object-storage, lifecycle-management, versioning, object-lock, event-notifications, kms-encryption]
  possible_targets: []
  alternatives: [google-cloud-storage, adls-gen2]
  replaces: [hdfs]
  suggested_next: [databricks-auto-loader, delta-bronze, aws-glue, amazon-redshift, landing-zone]
  migration_considerations:
    - Use AWS DataSync, Snowball or S3 Transfer Acceleration for bulk historical migration depending on volume and bandwidth.
    - Design bucket and prefix layout per zone (landing, bronze/raw, silver, gold) with separate access policies.
