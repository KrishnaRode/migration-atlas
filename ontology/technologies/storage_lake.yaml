- id: delta-lake
  name: Delta Lake
  aliases: [delta, delta lake, delta tables, delta format]
  vendor: Linux Foundation (Databricks)
  category: data-lake
  role: lakehouse
  layer: storage
  environment: any
  legacy: false
  clouds: [aws, azure, gcp, on-prem]
  stage: null
  platforms: []
  operational_model: managed
  icon: layers
  color: "#00ADD4"
  description: Open-source table format adding ACID transactions, schema enforcement, time travel, change data feed and liquid clustering on top of Parquet files in object storage.
  typical_legacy_use: Storage foundation of the Databricks lakehouse and Microsoft Fabric OneLake; replaces Hive/Parquet tables on HDFS and object storage.
  capabilities: [acid-transactions, time-travel, schema-enforcement, change-data-feed, merge-upsert, liquid-clustering, uniform-iceberg-interop]
  possible_targets: []
  alternatives: [apache-iceberg]
  replaces: [hdfs]
  suggested_next: [delta-bronze, unity-catalog, databricks, apache-spark]
  migration_considerations:
    - Convert existing Parquet/Hive tables in place with CONVERT TO DELTA or re-write with CTAS for layout optimisation.
    - Enable UniForm when Iceberg readers (Snowflake, BigQuery, Trino) also need access.
    - Plan OPTIMIZE / liquid clustering and VACUUM retention to balance performance, time travel and cost.
    - Check reader/writer protocol versions and table features for compatibility with non-Databricks engines.
  known_challenges:
    - Advanced table features (deletion vectors, liquid clustering) may not be supported by older external readers.
    - Concurrent writers to the same partitions can produce conflicts needing retry design.
  risks: [vendor-lock-in, performance-regression, skills-gap]
  strategies: [replatform, rearchitect]
  skills: [Delta Lake, Apache Spark, Lakehouse design]
  tags: [table-format, lakehouse, delta, open-source, acid]
  docs:
    - title: Delta Lake on Databricks
      url: https://docs.databricks.com/aws/en/delta/
    - title: Delta Lake documentation
      url: https://docs.delta.io/latest/index.html

- id: apache-iceberg
  name: Apache Iceberg
  aliases: [iceberg, apache iceberg, iceberg tables]
  vendor: Apache Software Foundation
  category: data-lake
  role: lakehouse
  layer: storage
  environment: any
  legacy: false
  clouds: [aws, azure, gcp, on-prem]
  stage: null
  platforms: []
  operational_model: managed
  icon: snowflake
  color: "#4C8BF5"
  description: Open table format for large analytic datasets providing ACID snapshots, hidden partitioning, partition and schema evolution, and time travel across many engines.
  typical_legacy_use: Interoperable table layer on S3/GCS/ADLS read by Spark, Trino, Flink, Snowflake, BigQuery (BigLake), Athena and Databricks; frequently replaces Hive tables.
  capabilities: [acid-transactions, time-travel, hidden-partitioning, schema-evolution, partition-evolution, multi-engine-access, rest-catalog]
  possible_targets: [delta-lake]
  alternatives: [delta-lake]
  replaces: [hdfs]
  suggested_next: [unity-catalog, aws-glue-data-catalog, snowflake, bigquery, apache-spark]
  migration_considerations:
    - Choose the catalog (REST catalog such as Unity Catalog or Polaris, Glue, Hive Metastore) first; it determines engine interoperability.
    - Migrate Hive tables with in-place snapshot/migrate procedures or rewrite for better layout.
    - Schedule snapshot expiration, orphan-file removal and compaction maintenance jobs.
  known_challenges:
    - Feature support (v2/v3 spec, row-level deletes) varies across engines and versions.
    - Catalog fragmentation causes inconsistent table visibility across engines.
  risks: [governance-gap, operational-readiness, skills-gap]
  strategies: [replatform, rearchitect]
  skills: [Apache Iceberg, Apache Spark, Lakehouse design]
  tags: [table-format, lakehouse, iceberg, open-source, acid]
  docs:
    - title: Apache Iceberg documentation
      url: https://iceberg.apache.org/docs/latest/

- id: hdfs
  name: Hadoop HDFS
  aliases: [hdfs, hadoop distributed file system, hadoop hdfs]
  vendor: Apache Software Foundation
  category: storage
  role: object-storage
  layer: storage
  environment: on-prem
  legacy: true
  clouds: [on-prem]
  stage: null
  platforms: []
  operational_model: self-managed
  icon: hard-drive
  color: "#66CCFF"
  description: Distributed, block-replicated file system of the Apache Hadoop ecosystem, co-locating storage with compute on commodity nodes.
  typical_legacy_use: Storage layer of on-prem Cloudera/Hortonworks data lakes holding raw files and Hive/Impala tables in ORC, Parquet, Avro and text formats.
  capabilities: [distributed-file-system, block-replication, data-locality, kerberos-security]
  possible_targets: [google-cloud-storage, amazon-s3, adls-gen2, delta-lake, apache-iceberg]
  alternatives: []
  replaces: []
  suggested_next: [amazon-s3, adls-gen2, google-cloud-storage, delta-lake]
  migration_considerations:
    - Use DistCp, cloud transfer services or offline appliances for petabyte-scale copies; plan bandwidth and incremental sync.
    - Convert Hive/ORC/text tables to Delta or Iceberg during or after copy rather than lifting raw layouts.
    - Map Ranger/Sentry policies and Kerberos principals to cloud IAM and catalog-level permissions.
    - Decouple storage from compute; jobs relying on HDFS-specific semantics (atomic rename, appends) need review.
  known_challenges:
    - Millions of small files and deep partition trees slow transfer and degrade cloud query performance.
    - Ranger policies, Hive views and UDFs carry hidden logic and access rules.
    - Inventorying which datasets are actually used is hard on long-lived clusters.
  risks: [data-volume-transfer, network-bandwidth, governance-gap, lineage-loss, security-gap]
  strategies: [retire, rehost, replatform, rearchitect]
  skills: [Hadoop administration, HDFS, Hive, Kerberos]
  tags: [storage, hadoop, legacy, on-prem]
  docs:
    - title: HDFS architecture guide
      url: https://hadoop.apache.org/docs/stable/hadoop-project-dist/hadoop-hdfs/HdfsDesign.html
