- id: raw-layer
  name: Raw Layer
  aliases: [raw layer, raw zone, raw data layer]
  vendor: Generic
  category: data-lake
  role: lake-layer
  layer: storage
  environment: any
  legacy: false
  clouds: [any]
  stage: raw
  platforms: []
  operational_model: managed
  icon: archive
  color: "#A16207"
  description: Platform-neutral lake zone holding source data as ingested, unmodified, with full history for replay and audit.
  typical_legacy_use: Raw directories in HDFS or object storage, or raw/ingest schemas in cloud warehouses such as Snowflake and BigQuery.
  capabilities: [raw-history, replay, audit, source-fidelity]
  possible_targets: [delta-bronze]
  alternatives: [delta-bronze, landing-zone]
  replaces: []
  suggested_next: [staging-layer, dbt, dataform]
  migration_considerations:
    - Preserve source fidelity and add ingestion metadata (source, batch id, load time).
    - Store in an open columnar format (Parquet, Delta, Iceberg) rather than raw CSV where possible.
    - Restrict access; raw data typically contains unmasked sensitive fields.
  known_challenges:
    - Without retention and compaction, raw zones grow unbounded and fragment into small files.
    - Inconsistent naming and partitioning across sources hampers discovery.
  risks: [schema-drift, governance-gap, cost-overrun]
