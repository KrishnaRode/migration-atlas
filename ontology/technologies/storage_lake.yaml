- id: adls-gen2
  name: Azure Data Lake Storage Gen2
  aliases: [adls, adls gen2, azure data lake storage, data lake storage gen2]
  vendor: Microsoft
  category: storage
  role: object-storage
  layer: storage
  environment: cloud
  legacy: false
  clouds: [azure]
  stage: null
  platforms: []
  operational_model: serverless
  icon: hard-drive
  color: "#0078D4"
  description: Azure Blob Storage with a hierarchical namespace, offering POSIX-style ACLs and atomic directory operations optimised for analytics workloads.
  typical_legacy_use: Primary data-lake storage on Azure beneath Azure Databricks, Synapse and Fabric (via OneLake shortcuts), commonly organised by medallion zones.
  capabilities: [object-storage, hierarchical-namespace, posix-acls, lifecycle-management, cmk-encryption]
  possible_targets: [microsoft-fabric]
  alternatives: [amazon-s3, google-cloud-storage]
  replaces: [hdfs]
  suggested_next: [databricks-auto-loader, delta-bronze, azure-data-factory, azure-synapse, landing-zone]
  migration_considerations:
    - Enable hierarchical namespace at account creation; it cannot be retrofitted without migration.
    - Use AzCopy, Data Box or ADF copy activities for bulk loads depending on volume and connectivity.
    - Combine Azure RBAC with ACLs carefully; prefer Unity Catalog or Purview policies for table-level governance.
    - Use private endpoints and disable public network access for regulated environments.
  known_challenges:
    - ACL inheritance does not apply retroactively to existing files.
    - Mixing Blob and DFS endpoints in tooling causes confusing behaviour.
  risks: [data-volume-transfer, network-bandwidth, security-gap, governance-gap]
  strategies: [replatform, rearchitect]
  skills: [Azure Storage, Microsoft Entra ID, Data lake design]
  tags: [storage, object-storage, azure, data-lake]
  docs:
    - title: Azure Data Lake Storage documentation
      url: https://learn.microsoft.com/azure/storage/blobs/data-lake-storage-introduction

- id: landing-zone
  name: Landing Zone
  aliases: [landing zone, landing layer, landing area, file landing]
  vendor: Generic
  category: data-lake
  role: lake-layer
  layer: storage
  environment: any
  legacy: false
  clouds: [any]
  stage: landing
  platforms: []
  operational_model: managed
  icon: folder
  color: "#94A3B8"
  description: Transient object-storage zone where source extracts, files and CDC batches arrive unchanged before being ingested into the lake or lakehouse.
  typical_legacy_use: SFTP drop folders or staging directories on shared file systems where upstream systems deposit daily extract files.
  capabilities: [file-landing, immutable-arrival, ingestion-trigger, retention-policy]
  possible_targets: []
  alternatives: [raw-layer]
  replaces: []
  suggested_next: [delta-bronze, raw-layer, databricks-auto-loader]
  migration_considerations:
    - Keep landed files immutable and partitioned by source and arrival date to support replay and audit.
    - Define retention so landing is cleaned up after successful ingestion into bronze/raw.
    - Separate landing credentials from downstream zones; producers should only have write access.
  known_challenges:
    - Late-arriving or partial files need completion markers or manifest files to avoid premature ingestion.
    - Landing often becomes an unmanaged archive without retention enforcement.
  risks: [data-quality-regression, security-gap, governance-gap]
  strategies: [rearchitect]
  skills: [Data lake design, Object storage]
  tags: [lake, landing, zone, ingestion]
  docs:
    - title: Medallion architecture (Databricks)
      url: https://docs.databricks.com/aws/en/lakehouse/medallion

- id: delta-bronze
  name: Bronze Layer (Delta)
  aliases: [bronze, bronze layer, bronze tables, delta bronze]
  vendor: Databricks
  category: data-lake
  role: lake-layer
  layer: storage
  environment: cloud
  legacy: false
  clouds: [aws, azure, gcp]
  stage: bronze
  platforms: [databricks]
  operational_model: managed
  icon: layers
  color: "#B45309"
  description: Medallion bronze zone holding raw, append-only Delta tables that preserve source fidelity plus ingestion metadata.
  typical_legacy_use: Replaces raw staging schemas in legacy warehouses and raw HDFS directories in Hadoop estates.
  capabilities: [raw-history, append-only-ingestion, schema-evolution, replay, ingestion-metadata]
  possible_targets: []
  alternatives: [raw-layer]
  replaces: []
  suggested_next: [delta-silver, lakeflow-declarative-pipelines, unity-catalog]
  migration_considerations:
    - Ingest with Auto Loader or Lakeflow Connect, capturing source file, load timestamp and source system columns.
    - Store data close to source types (or as strings/variant) to avoid ingestion failures on schema drift.
    - Register bronze tables in Unity Catalog with restricted access, as they often contain unmasked PII.
  known_challenges:
    - Unbounded bronze growth without retention or VACUUM policies drives storage cost.
    - Schema evolution settings must be explicit to avoid silent column loss or job failures.
  risks: [schema-drift, governance-gap, cost-overrun]
  strategies: [rearchitect]
  skills: [Databricks, Delta Lake, Auto Loader]
  tags: [lake, medallion, bronze, delta, databricks]
  docs:
    - title: Medallion architecture (Databricks)
      url: https://docs.databricks.com/aws/en/lakehouse/medallion

- id: delta-silver
  name: Silver Layer (Delta)
  aliases: [silver, silver layer, silver tables, delta silver]
  vendor: Databricks
  category: data-lake
  role: lake-layer
  layer: storage
  environment: cloud
  legacy: false
  clouds: [aws, azure, gcp]
  stage: silver
  platforms: [databricks]
  operational_model: managed
  icon: layers
  color: "#64748B"
  description: Medallion silver zone holding cleansed, conformed, deduplicated and type-enforced Delta tables at entity grain.
  typical_legacy_use: Replaces integration/ODS layers and conformed staging schemas in legacy warehouses.
  capabilities: [data-cleansing, deduplication, scd-handling, conformance, data-quality-expectations]
  possible_targets: []
  alternatives: [staging-layer]
  replaces: []
  suggested_next: [delta-gold, lakehouse-monitoring, unity-catalog]
  migration_considerations:
    - Apply MERGE / AUTO CDC (APPLY CHANGES) to build current-state and SCD Type 2 tables from bronze change feeds.
    - Encode data-quality rules as expectations and quarantine failing records rather than dropping them silently.
    - Align silver entities with legacy ODS/integration-layer tables to enable reconciliation.
  known_challenges:
    - Business rules hidden in legacy ETL must be rediscovered and reimplemented here.
    - Late-arriving and out-of-order CDC events complicate SCD logic.
  risks: [hidden-business-logic, data-quality-regression, schema-drift]
  strategies: [rearchitect]
  skills: [Databricks, Delta Lake, Data modelling]
  tags: [lake, medallion, silver, delta, databricks]
  docs:
    - title: Medallion architecture (Databricks)
      url: https://docs.databricks.com/aws/en/lakehouse/medallion

