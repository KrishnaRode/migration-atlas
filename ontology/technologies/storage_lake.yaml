# Object storage, lake/lakehouse zones and open table formats.
- id: google-cloud-storage
  name: Google Cloud Storage
  aliases: [gcs, google cloud storage, cloud storage, gs bucket]
  vendor: Google Cloud
  category: storage
  role: object-storage
  layer: storage
  environment: cloud
  legacy: false
  clouds: [gcp]
  stage: null
  platforms: []
  operational_model: serverless
  icon: hard-drive
  color: "#4285F4"
  description: Durable, strongly consistent object storage on Google Cloud with regional, dual-region and multi-region buckets and Standard to Archive storage classes.
  typical_legacy_use: Raw landing and archive zone for files, database extracts and exports on Google Cloud, and the storage layer beneath Dataproc, Databricks on GCP and BigQuery external/BigLake tables.
  capabilities: [object-storage, lifecycle-management, storage-classes, cmek-encryption, event-notifications]
  possible_targets: []
  alternatives: [amazon-s3, adls-gen2]
  replaces: [hdfs]
  suggested_next: [databricks-auto-loader, delta-bronze, bigquery, google-dataflow, landing-zone]
  migration_considerations:
    - Use Storage Transfer Service or Transfer Appliance for bulk historical loads; size network bandwidth against volume and cutover window.
    - Choose bucket location (region vs dual-region) to co-locate with compute and meet data-residency requirements.
    - Define lifecycle rules and storage classes up-front to control cost of raw and archival zones.
    - Apply uniform bucket-level access, CMEK and VPC Service Controls perimeters for regulated data.
  known_challenges:
    - Small-file proliferation from naive ingestion degrades downstream Spark and BigQuery performance.
    - Egress and inter-region transfer charges are often under-estimated.
  risks: [data-volume-transfer, network-bandwidth, security-gap, cost-overrun]
  strategies: [replatform, rearchitect]
  skills: [Google Cloud Storage, GCP IAM, Data lake design]
  tags: [storage, object-storage, gcp, data-lake]
  docs:
    - title: Cloud Storage documentation
      url: https://cloud.google.com/storage/docs

- id: amazon-s3
  name: Amazon S3
  aliases: [s3, amazon s3, s3 bucket, simple storage service]
