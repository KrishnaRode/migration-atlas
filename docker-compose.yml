# Optional containerised run. Ollama stays on the host (GPU/Metal access), reached via
# host.docker.internal. Native `./start.sh` is the recommended path on a laptop.
services:
  api:
    build: { context: ., dockerfile: docker/backend.Dockerfile }
    ports: ["8014:8014"]
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      ATLAS_CORS_ORIGINS: http://localhost:3014,http://127.0.0.1:3014
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["atlas-data:/data"]
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args: { NEXT_PUBLIC_API_URL: "http://localhost:8014" }
    ports: ["3014:3014"]
    depends_on: [api]
volumes:
  atlas-data:
